function doMerge(fid,tid){const a=cust(fid),b=cust(tid);
  if(S.role!=='owner'){toast(t('Only the owner can merge customers'));return}
  if(!a||!b||a===b){closeSheet();return}
  const n=a.tx.length,before=etb(bal(a))+' + '+etb(bal(b));
  b.tx=b.tx.concat(a.tx).sort((x,y)=>x.ts-y.ts);
  ['addr','nid','gname','gphone'].forEach(k=>{if(!b[k]&&a[k])b[k]=a[k]});
  if(a.limit!=null||b.limit!=null)b.limit=Math.max(climit(a),climit(b));
  if(!b.term&&a.term)b.term=a.term;
  S.sales.forEach(s=>{if(s.cust===a.id)s.cust=b.id});
  if(S.cartCust===a.id)S.cartCust=b.id;if(S.sellCust===a.id)S.sellCust=b.id;
  S.customers.splice(S.customers.indexOf(a),1);
  log('credit','Merged customer '+a.name+' into '+b.name,n+' entries · '+before+' = '+etb(bal(b)));
  S.stack[S.stack.length-1]={n:'customer',p:{id:b.id}};closeSheet();toast(t('Customers merged'));render()}

/* ---------- RX LOG ---------- */
/* RX1 full legal record · RX2 search, filters, PDF and Excel export · RX3 append-only corrections linked to sales and returns.
   An entry is never edited or deleted. A correction is a NEW entry with fix:{of,reason,by,ts,ch}. The older entry stays in the log. */
const RXK={p:'patient',n:'rxNo',d:'doc',rd:'rxDate',ag:'age',sx:'sex',ph:'phone',pid:'pid',lic:'lic',fac:'fac',dir:'dir'};
const RX_F=[['p','Patient name'],['ag','Patient age'],['sx','Sex'],['ph','Patient phone'],['pid','Patient ID number'],['n','Rx number'],['rd','Prescription date'],['d','Prescriber'],['lic','Prescriber license no.'],['fac','Facility'],['dir','Dose and directions']];
const RX_SEX={M:'Male',F:'Female'};
const RX_FIXWHY=['Typing mistake','Missing information','Wrong patient details','Other'];
/* required for every Rx sale; controlled drugs also need phone, ID number and facility */
const rxReq=type=>['p','ag','sx','n','rd','d','lic','dir'].concat(type==='ctrl'?['ph','pid','fac']:[]);
const rxLbl=k=>t((RX_F.find(f=>f[0]===k)||[0,k])[1]);
const rxLblE=e=>{const k=Object.keys(RXK).find(x=>RXK[x]===e);return k?rxLbl(k):e};
const rxId=n=>n?(typeof n==='number'?'RL-'+String(n).padStart(5,'0'):'RL-'+n):'—';
const rxVal=(r,k)=>String(r[RXK[k]]==null?'':r[RXK[k]]).trim();
S.rxSeq=S.rx.reduce((a,r)=>Math.max(a,typeof r.seq==='number'?r.seq:0),0);S.rx.filter(r=>!r.seq).sort((a,b)=>a.ts-b.ts).forEach(r=>{r.seq=++S.rxSeq});
Object.assign(S,{rxq:'',rxr:'all',rxFrom:'',rxTo:'',rxMed:'all',rxst:'all',rxLim:40,rxErr:{},rxFx:null});
/* versions: an entry is superseded when a later entry corrects it */
let _rxc={n:-1,s:null};
function rxSup(){if(_rxc.n!==S.rx.length)_rxc={n:S.rx.length,s:new Set(S.rx.filter(x=>x.fix).map(x=>x.fix.of))};return _rxc.s}
const rxCur=r=>!(r.seq&&rxSup().has(r.seq));
const rxLive=r=>rxCur(r)&&!r.ret;
function rxChain(r){const out=[r];let c=r;while(c.fix){const p=S.rx.find(x=>x.seq===c.fix.of);if(!p)break;out.unshift(p);c=p}return out}
const rxGaps=r=>rxReq(r.kind).filter(k=>!rxVal(r,k));
function rxProblems(type,f){const out=[],v=k=>String(f[k]==null?'':f[k]).trim();
  rxReq(type).forEach(k=>{if(!v(k))out.push({k,msg:rxLbl(k)})});
  const bad=(k,m)=>{if(v(k)&&!out.some(o=>o.k===k))out.push({k,msg:m})};
  if(v('ag')){const a=Number(v('ag'));if(!(Number.isFinite(a)&&a>=0&&a<=120))bad('ag',t('Age must be 0 to 120'))}
  if(v('rd')&&v('rd')>iso(new Date()))bad('rd',t('Prescription date cannot be in the future'));
  if(v('ph')&&v('ph').replace(/\D/g,'').length<9)bad('ph',t('Phone number is too short'));
  return out}
function rxFlag(x){S.rxErr[x.m.id]=x.pr.map(o=>o.k);const e=$('#rxc_'+x.m.id);
  if(e){e.innerHTML=rxInner(x.m);if(e.scrollIntoView)e.scrollIntoView({block:'center',behavior:'smooth'})}
  toast(t('Complete the Rx details')+' ('+x.m.name+'): '+x.pr.slice(0,3).map(o=>o.msg).join(', ')+(x.pr.length>3?' +'+(x.pr.length-3):''))}
function rxClr(el){el.classList.remove('err');const e=S.rxErr[el.dataset.m];if(e)S.rxErr[el.dataset.m]=e.filter(k=>k!==el.dataset.k)}
/* the entry saved by a sale: date and time, batch, who sold and the sale number are filled in automatically */
function rxEntry(sid,ts,x,f){const e={seq:newRx(),sid,ts,medId:x.m.id,qty:x.qty,kind:x.m.type,img:f.img||'',by:who(),bt:x.a.map(y=>({no:y.b.no,q:y.take}))};
  Object.keys(RXK).forEach(k=>{e[RXK[k]]=String(f[k]==null?'':f[k]).trim()});return e}

/* ---- RX2: search, filters, export ---- */
function rxBounds(){const n=new Date(),D=new Date(n.getFullYear(),n.getMonth(),n.getDate()).getTime(),r=S.rxr;
  if(r==='today')return[D,Infinity];if(r==='d7')return[D-6*DAY,Infinity];if(r==='d30')return[D-29*DAY,Infinity];
  if(r==='m3')return[new Date(n.getFullYear(),n.getMonth()-3,n.getDate()).getTime(),Infinity];
  if(r==='custom')return[S.rxFrom?parseD(S.rxFrom).getTime():-Infinity,S.rxTo?parseD(S.rxTo).getTime()+DAY-1:Infinity];
  return[-Infinity,Infinity]}
function rxPeriod(){const r=S.rxr,P={all:'All time',today:'Today',d7:'Last 7 days',d30:'Last 30 days',m3:'Last 3 months'};
  if(r==='custom')return(S.rxFrom?fmtD(S.rxFrom):'…')+' – '+(S.rxTo?fmtD(S.rxTo):'…');return t(P[r]||'All time')}
function rxHay(r){const m=med(r.medId)||{},ch=rxChain(r).map(x=>[x.patient,x.rxNo,x.doc,x.lic,x.fac,x.phone,String(x.phone||'').replace(/\D/g,''),x.pid,x.dir].join(' ')).join(' ');
  return (ch+' '+[m.name,m.gen,(m.aka||[]).join(' '),(r.bt||[]).map(b=>b.no).join(' '),S.rno[r.sid]||'',rxId(r.seq),r.by].join(' ')).toLowerCase()}
const rxFiltOn=()=>!!(S.rxq.trim()||S.rxr!=='all'||S.rxMed!=='all'||S.rxst!=='all'||S.rxf!=='all');
function rxList(){const [a,b]=rxBounds(),toks=S.rxq.toLowerCase().split(/\s+/).filter(Boolean);
  return S.rx.filter(r=>{
    if(!rxCur(r))return false;
    if(S.rxf!=='all'&&r.kind!==S.rxf)return false;
    if(r.ts<a||r.ts>b)return false;
    if(S.rxMed!=='all'&&r.medId!==S.rxMed)return false;
    if(S.rxst==='ok'&&r.ret)return false;
    if(S.rxst==='ret'&&!r.ret)return false;
    if(S.rxst==='fix'&&!r.fix)return false;
    if(toks.length){const h=rxHay(r);if(!toks.every(x=>h.includes(x)))return false}
    return true}).sort((x,y)=>y.ts-x.ts||rxCmp(y,x))}
function rxFilterText(f){f=f||(x=>x);const a=[rxPeriod()];
  if(S.rxf!=='all')a.push(f(S.rxf==='ctrl'?'Controlled':'Prescription'));
  if(S.rxMed!=='all'){const m=med(S.rxMed);if(m)a.push(m.name)}
  if(S.rxst!=='all')a.push(f({ok:'Active',ret:'Returned',fix:'Corrected'}[S.rxst]));
  if(S.rxq.trim())a.push('“'+S.rxq.trim()+'”');return a.join(' · ')}
function rxPrint(html){const f=document.createElement('iframe');f.style.cssText='position:fixed;right:0;bottom:0;width:0;height:0;border:0';document.body.appendChild(f);const w=f.contentWindow.document;w.open();w.write(html);w.close();
  setTimeout(()=>{try{f.contentWindow.focus();f.contentWindow.print()}catch(e){toast(t('Printing is not available here'))}setTimeout(()=>f.remove(),5000)},300)}
const RX_PCSS='@page{size:A4 landscape;margin:8mm}*{box-sizing:border-box}body{margin:0;font:9px/1.35 "Noto Sans Ethiopic",Arial,sans-serif;color:#111}.pg{display:flex;flex-direction:column;min-height:192mm;page-break-after:always}.pg:last-child{page-break-after:auto}.hd{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid #111;padding-bottom:5px}h1{font-size:15px;margin:0}.tt{font-size:12px;font-weight:700;margin-top:2px}.pn{font-size:11px;font-weight:700}.mt{display:flex;flex-wrap:wrap;gap:3px 18px;margin:6px 0 8px}h2{font-size:12px;margin:4px 0 6px}table{width:100%;border-collapse:collapse;table-layout:fixed}th{background:#ececec;border:1px solid #888;padding:3px 4px;text-align:left;font-size:8.5px}td{border:1px solid #aaa;padding:3px 4px;vertical-align:top;overflow-wrap:anywhere}tr{page-break-inside:avoid}.no{font-weight:700}.c{text-align:center}.ft{margin-top:auto;padding-top:10px}.en{font-size:8.5px;margin-bottom:6px}.sig{display:flex;gap:28px}.sg{flex:1}.sg i{display:block;height:30px;border-bottom:1px solid #111}.sg span{display:block;font-size:8.5px;margin-top:2px}';
function rxDoc(l,sum){
  const H=x=>esc(x==null?'':x),asc=l.slice().sort((a,b)=>a.ts-b.ts||rxCmp(a,b)),units=l.filter(r=>!r.ret).reduce((a,r)=>a+r.qty,0),
    fx=[];asc.forEach(r=>rxChain(r).slice(1).forEach(c=>fx.push(c)));
  const chunk=(a,n)=>{const o=[];for(let i=0;i<a.length;i+=n)o.push(a.slice(i,i+n));return o},
    P1=chunk(asc,7),P2=chunk(fx,9),N=P1.length+P2.length;
  const row=r=>{const m=med(r.medId)||{name:''},rt=r.ret,rc=S.rno[r.sid];
    return `<tr><td class="no">${rxId(r.seq)}${r.fix?'<br>'+H(t('Corrected')):''}</td><td>${fmtD(dayKey(r.ts))}<br>${timeOf(r.ts)}</td>
    <td><b>${H(m.name)}</b><br>${r.kind==='ctrl'?H(t('Controlled')):'Rx'}<br>${H(t('Batch'))}: ${(r.bt||[]).map(b=>H(b.no)+' × '+b.q).join(', ')||'—'}</td><td class="c">${r.qty}</td>
    <td><b>${H(r.patient)||'—'}</b><br>${[r.age?H(r.age)+' '+H(t('years')):'',r.sex?H(t(RX_SEX[r.sex]||r.sex)):''].filter(Boolean).join(', ')}${r.phone?'<br>'+H(r.phone):''}${r.pid?'<br>ID: '+H(r.pid):''}</td>
    <td>${H(r.rxNo)||'—'}<br>${r.rxDate?fmtD(r.rxDate):'—'}</td><td>${H(r.doc)||'—'}<br>${H(t('License no.'))}: ${H(r.lic)||'—'}${r.fac?'<br>'+H(r.fac):''}</td>
    <td>${H(r.dir)||'—'}</td><td>${H(r.by)||'—'}${rc?'<br>'+H(rc):''}</td>
    <td>${rt?'<b>'+H(t('Returned'))+'</b><br>'+fmtD(dayKey(rt.ts))+'<br>'+H(rt.reason):H(t('Active'))}</td></tr>`};
  const th=`<thead><tr>${[[6,'Entry no.'],[7,'Dispensed'],[14,'Medicine'],[4,'Qty'],[14,'Patient'],[9,'Rx no. and date'],[15,'Prescriber, license, facility'],[14,'Directions'],[9,'Sold by / receipt'],[8,'Status']].map(c=>`<th style="width:${c[0]}%">${H(t(c[1]))}</th>`).join('')}</tr></thead>`;
  const fxRow=c=>`<tr><td class="no">${rxId(c.fix.of)} → ${rxId(c.seq)}</td><td>${fmtD(dayKey(c.fix.ts))}<br>${timeOf(c.fix.ts)}</td><td>${H(c.fix.by)}</td><td>${H(t(c.fix.reason))}${c.fix.note?'<br>'+H(c.fix.note):''}</td><td>${c.fix.ch.map(x=>H(rxLblE(x.k))+': '+H(x.from||'—')+' → '+H(x.to||'—')).join('<br>')}</td></tr>`;
  const fth=`<thead><tr>${[[12,'Entry no.'],[10,'Dispensed'],[14,'Corrected by'],[24,'Why is it being corrected?'],[40,'What changed']].map(c=>`<th style="width:${c[0]}%">${H(t(c[1]))}</th>`).join('')}</tr></thead>`;
  const page=(i,body,ids)=>`<section class="pg"><div class="hd"><div><h1>${H(shopN())}</h1><div class="tt">${H(t('Prescription and controlled drug register'))}</div>${profLine(1)?`<div class="tt">${H(profLine(1))}</div>`:''}</div><div class="pn">${H(tf('Page {a} of {b}',{a:i,b:N}))}</div></div>
    <div class="mt"><span><b>${H(t('Period'))}:</b> ${H(rxPeriod())}</span><span><b>${H(t('Filters'))}:</b> ${H(sum)}</span><span><b>${H(t('Entries'))}:</b> ${l.length} · ${units} ${H(t('units'))}</span><span><b>${H(t('Created'))}:</b> ${fmtD(iso(new Date()))} ${timeOf(Date.now())}, ${H(who())}</span></div>
    ${body}<div class="ft"><div class="en">${ids?H(t('Entries on this page'))+': '+ids:''}</div><div class="sig"><div class="sg"><i></i><span>${H(t('Pharmacist'))} · ${H(t('Name, signature and date'))}</span></div><div class="sg"><i></i><span>${H(t('Owner'))} · ${H(t('Name, signature and date'))}</span></div></div></div></section>`;
  return `<html><head><meta charset="utf-8"><title>${H(t('Prescription and controlled drug register'))}</title><style>${RX_PCSS}</style></head><body>`
    +P1.map((c,i)=>page(i+1,`<table>${th}<tbody>${c.map(row).join('')}</tbody></table>`,c.map(r=>rxId(r.seq)).join(', '))).join('')
    +P2.map((c,i)=>page(P1.length+i+1,`<h2>${H(t('Corrections'))}</h2><table>${fth}<tbody>${c.map(fxRow).join('')}</tbody></table>`,'')).join('')+'</body></html>'}
function rxCsv(l){
  const q=v=>{v=String(v==null?'':v);if(/^[=+\-@\t\r]/.test(v))v="'"+v;return '"'+v.replace(/"/g,'""')+'"'},
    tx=v=>{v=String(v==null?'':v).trim();return v&&/^\+?[\d\s-]+$/.test(v)?'"=""'+v+'"""':q(v)};
  const cols=['Entry no.','Status','Dispensed date','Dispensed time','Medicine','Type','Batch no.','Quantity','Patient name','Age','Sex','Patient phone','Patient ID number','Rx number','Prescription date','Prescriber','License no.','Facility','Directions','Sold by','Receipt no.','Returned on','Return reason','Returned by','Correction of','Correction date','Correction reason','Corrected by'],out=[cols.map(q).join(',')];
  l.slice().sort((a,b)=>a.ts-b.ts||rxCmp(a,b)).forEach(r=>{const ch=rxChain(r);ch.forEach((c,i)=>{const m=med(c.medId)||{name:''},last=i===ch.length-1,rt=c.ret,fx=c.fix;
    out.push([q(rxId(c.seq)),q(last?(rt?'Returned':'Active'):'Superseded by '+rxId(ch[i+1].seq)),q(dsd(dayKey(c.ts))),q(timeOf(c.ts)),q(m.name),q(c.kind==='ctrl'?'Controlled':'Prescription'),q((c.bt||[]).map(b=>b.no+' x '+b.q).join('; ')),q(c.qty),
      q(c.patient),q(c.age),q(c.sex?RX_SEX[c.sex]:''),tx(c.phone),tx(c.pid),q(c.rxNo),q(c.rxDate),q(c.doc),q(c.lic),q(c.fac),q(c.dir),q(c.by),q(S.rno[c.sid]||''),
      q(rt?dsd(dayKey(rt.ts))+' '+timeOf(rt.ts):''),q(rt?rt.reason+(rt.note?': '+rt.note:''):''),q(rt?rt.by:''),
      q(fx?rxId(fx.of):''),q(fx?dsd(dayKey(fx.ts))+' '+timeOf(fx.ts):''),q(fx?fx.reason+(fx.note?': '+fx.note:''):''),q(fx?fx.by:'')].join(','))})});
  return out.join('\n')}
function rxExport(kind){const l=rxList();if(!l.length){toast(t('No entries to export'));return}
  if(kind==='pdf'){rxPrint(rxDoc(l,rxFilterText(t)));toast(t('In the print window, choose Save as PDF'));log('access','Exported Rx log as PDF',l.length+' entries')}
  else{dl('rx-log-'+iso(new Date())+'.csv',rxCsv(l));toast('Excel file saved (CSV opens in Excel)');log('access','Exported Rx log as Excel',l.length+' entries')}}

/* ---- RX3: correction sheet. The original stays; the correction is saved as a new linked entry. ---- */
function rxFixSheet(i){const r=S.rx[+i];if(!r)return;
  if(!canEdit()){toast(t('Only a pharmacist or the owner can correct an entry'));return}
  if(!rxCur(r)){toast(t('This entry was already corrected'));return}
  S.rxFx={i:+i,why:'',sx:r.sex||''};
  const m=med(r.medId)||{name:''},ctrl=r.kind==='ctrl',req=rxReq(r.kind),
    mk=k=>req.includes(k)?' <i class="req">*</i>':' <span class="muted">('+t('optional')+')</span>',
    fld=(k,a,area)=>{const v=esc(rxVal(r,k));return `<div><label for="fx_${k}">${rxLbl(k)}${mk(k)}</label>${area?`<textarea id="fx_${k}" class="inp" rows="2">${v}</textarea>`:`<input id="fx_${k}" class="inp" value="${v}" autocomplete="off"${a||''}>`}</div>`};
  openSheet(`<h3>${t('Correct entry')} · ${rxId(r.seq)}</h3><div class="muted">${esc(m.name)} · ${r.qty} ${t('units')} · ${fmtD(dayKey(r.ts))} ${timeOf(r.ts)}</div>
   <div class="note info" style="margin-top:12px">${ic('lock',16)}<span>${t('The original entry stays in the log. Your correction is saved as a new entry linked to it, with the reason and your name.')}</span></div>
   ${fld('p')}
   <div class="rxg">${fld('ag',' type="number" min="0" max="120" inputmode="numeric"')}<div><label>${rxLbl('sx')}${mk('sx')}</label><div class="seg" id="fxsx">${[['M','Male'],['F','Female']].map(x=>`<button type="button" class="${r.sex===x[0]?'on':''}" data-a="rxFixSex" data-v="${x[0]}">${t(x[1])}</button>`).join('')}</div></div></div>
   ${ctrl?`<div class="rxg">${fld('ph',' inputmode="tel"')}${fld('pid')}</div>`:fld('ph',' inputmode="tel"')}
   <div class="rxg">${fld('n')}${fld('rd',' type="date" max="'+iso(new Date())+'"')}</div>
   ${fld('d')}<div class="rxg">${fld('lic')}${fld('fac')}</div>${fld('dir','',1)}
   <div class="muted" style="margin-top:10px">${t('Medicine, quantity and batch come from the sale. To change them, return the sale and sell again.')}</div>
   <div class="rsec"><span>${t('Why is it being corrected?')}</span><span class="t-red">${t('Required')}</span></div>
   <div class="chips" id="fxchips" role="group" aria-label="${esc(t('Reason'))}">${RX_FIXWHY.map(x=>`<button type="button" class="chp" data-a="rxFixWhy" data-v="${x}">${t(x)}</button>`).join('')}</div>
   <label id="fxnl" for="fx_note" style="margin-top:14px">${t('Note (optional)')}</label><input id="fx_note" class="inp" autocomplete="off" placeholder="${esc(t('Add a short note'))}">
   <div class="rbtns"><button class="btn ghost" data-a="closeSheet">${t('Cancel')}</button><button class="btn" data-a="rxFixSave">${t('Save correction')}</button></div>`)}
function rxFixSave(){const X=S.rxFx;if(!X)return;
  if(!canEdit()){toast(t('Only a pharmacist or the owner can correct an entry'));return}
  const r=S.rx[X.i];if(!r||!rxCur(r)){toast(t('This entry was already corrected'));closeSheet();render();return}
  const f={};Object.keys(RXK).forEach(k=>{f[k]=k==='sx'?X.sx:($('#fx_'+k)?val('fx_'+k):rxVal(r,k))});
  const pr=rxProblems(r.kind,f);
  if(pr.length){pr.forEach(o=>{const e=o.k==='sx'?$('#fxsx'):$('#fx_'+o.k);if(e)e.classList.add('err')});toast(t('Complete the Rx details')+': '+pr.slice(0,3).map(o=>o.msg).join(', '));return}
  const ch=[];Object.keys(RXK).forEach(k=>{const a=rxVal(r,k),b=String(f[k]).trim();if(a!==b)ch.push({k:RXK[k],from:a,to:b})});
  if(!ch.length){toast(t('Nothing changed'));return}
  if(!X.why){toast(t('Choose a reason'));return}
  const note=val('fx_note').trim();if(X.why==='Other'&&!note){toast(t('Write the reason in the note'));return}
  const now=Date.now(),n=Object.assign({},r,{seq:newRx(),fix:{of:r.seq,ts:now,by:who(),reason:X.why,note,ch}});
  ch.forEach(c=>{n[c.k]=c.to});S.rx.push(n);
  log('rx','Corrected Rx entry '+rxId(r.seq)+' → '+rxId(n.seq),X.why+(note?': '+note:'')+' · '+ch.map(c=>RX_PII.includes(c.k)?rxLblE(c.k)+' changed':rxLblE(c.k)+': '+(c.from||'—')+' → '+(c.to||'—')).join('; '));
  S.rxFx=null;closeSheet();toast(t('Correction saved'));render()}

  return `<div class="card"><div class="rowb"><div><b>${esc(s.name)}</b><div class="muted">${t('Invoice')} ${esc(b.inv)}${b.po?' · '+esc(b.po):''}</div></div>${bd(tone[1],tone[0])}</div>
  <div class="rowb" style="margin-top:10px"><span class="muted">${t('Amount')}</span><b>${etb(b.amt)}</b></div>
  ${p>0?`<div class="pbar2${l>0?' part':''}"><i style="width:${Math.min(100,Math.round(p/b.amt*100))}%"></i></div><div class="rowb" style="margin-top:4px"><span class="muted">${tf('Paid {a}',{a:etb(p)})}</span><b>${l>0?tf('Left {a}',{a:etb(l)}):''}</b></div>`:''}

function payables(){const f=S.pf||'open',B=dueB(),all=[...S.bills],open=all.filter(b=>billLeft(b)>0).sort((a,b)=>a.due<b.due?-1:1),done=all.filter(b=>billLeft(b)<=0).sort((a,b)=>b.ts-a.ts),L=f==='open'?open:done;
  return `<div class="card"><div class="muted">${t('Money to pay suppliers')}</div><b style="font-size:24px">${etb(B.open)}</b><div style="margin-top:6px">${dueRows(B)||`<div class="muted">${t('No unpaid invoices')}</div>`}</div></div>`

const CTRL_DAYS=7; /* every controlled drug is counted by hand this often */

function lastCnt(m){stInit();for(const x of S.sessions){const i=x.items.find(y=>y.id===m.id);if(i)return{ts:x.ts,net:i.net,why:i.why,id:x.id}}return null}

/* opening + in - out + adjusted = expected balance. Expected counts every unit on the shelf, expired ones too. */
function regCalc(m,p){const now=Date.now(),since=p==='cnt'?(m.lastCount||now-30*DAY)+2000:now-(p==='d30'?30:7)*DAY,end=tot(m),r={in:0,out:0,adj:0};

 r.open=end-r.in+r.out-r.adj;r.exp=end;r.ex=m.batches.filter(b=>daysTo(b.exp)<0).reduce((a,b)=>a+b.qty,0);return r}

 plan.forEach(x=>{if(x.m.type==='otc')return;const f=rxs[x.m.id]||{},p=normS(f.p),n=normS(f.n),c=x.m.type==='ctrl',tx=z=>out.push({m:x.m,txt:z});
