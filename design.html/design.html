<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PharmaCare App Preview 28</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Noto+Sans+Ethiopic:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
--pg:#e4e9f3;--bg:#f4f6fa;--card:#fff;--card2:#f0f3f9;--tx:#0e1a33;--mu:#5a6a88;--ln:#e2e7f0;--ln2:#cdd5e3;
--pr:#1d4ed8;--pr2:#1e40af;--prc:#e8eeff;--onpr:#fff;
--red:#c62a37;--redc:#fdecee;--amb:#8a5300;--amf:#e69a00;--ambc:#fff3d6;--grn:#0b7a43;--grnc:#ddf4e8;
--blu:#1d4ed8;--bluc:#e8eeff;--pur:#5b3db5;--purc:#eee9fb;
--sh:0 10px 30px rgba(14,26,51,.18);color-scheme:light}
[data-theme=dark]{
--pg:#04080f;--bg:#0b1220;--card:#111a2e;--card2:#17223a;--tx:#e7ecf8;--mu:#93a3c4;--ln:#223051;--ln2:#2e3f68;
--pr:#6b95ff;--pr2:#5584f5;--prc:#182a5e;--onpr:#071230;
--red:#ff8d96;--redc:#3d1a26;--amb:#ffc66e;--amf:#ffc66e;--ambc:#3a2d12;--grn:#6fe0a4;--grnc:#123428;
--blu:#93b2ff;--bluc:#182a5e;--pur:#c5acff;--purc:#2a2150;
--sh:0 10px 30px rgba(0,0,0,.55);color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font:14.5px/1.45 "IBM Plex Sans","Noto Sans Ethiopic",system-ui,-apple-system,"Segoe UI",Roboto,Nyala,sans-serif;background:var(--pg);color:var(--tx);display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
[hidden]{display:none!important}
button{font-family:inherit;color:inherit}
:focus-visible{outline:2px solid var(--pr);outline-offset:2px}
h1{font-size:17px;font-weight:600}h2{font-size:18px;font-weight:600}h3{font-size:15px;font-weight:600}
.phone{position:relative;width:100%;height:100vh;height:100dvh;background:var(--bg);overflow:hidden;color:var(--tx)}
@media(min-width:520px){.phone{width:390px;height:min(844px,calc(100vh - 32px));height:min(844px,calc(100dvh - 32px));border-radius:36px;box-shadow:0 0 0 10px #0e1a33,0 30px 70px rgba(14,26,51,.35)}}
.app{position:absolute;inset:0;display:flex;flex-direction:column}

/* header */
.hdr{flex:none;display:flex;align-items:center;gap:6px;height:58px;padding:0 10px;background:var(--card);border-bottom:1px solid var(--ln)}
.ht{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;margin-left:2px}
.ht h1{line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hsub{font-size:11.5px;color:var(--mu);line-height:1.2}
.ibtn{width:40px;height:40px;border-radius:10px;border:0;background:transparent;color:var(--tx);display:grid;place-items:center;position:relative;cursor:pointer;flex:none}
.ibtn:active{background:var(--card2)}
.cnt{position:absolute;top:4px;right:2px;min-width:16px;height:16px;border-radius:8px;background:#d93a46;color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 3px;border:1.5px solid var(--card);box-sizing:content-box}
.sync{display:flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:15px;border:1px solid var(--ln);background:var(--card);font-size:12px;font-weight:600;cursor:pointer;color:var(--tx);flex:none}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--grn)}
.sync.off i{background:var(--amf)}
.offbar{flex:none;background:var(--ambc);color:var(--amb);font-size:12px;font-weight:500;padding:6px 16px;text-align:center;border-bottom:1px solid var(--ln)}

/* bottom navigation */
.nav{flex:none;display:flex;background:var(--card);border-top:1px solid var(--ln);padding:0 4px env(safe-area-inset-bottom)}
.nav button{flex:1;position:relative;height:60px;border:0;background:none;color:var(--mu);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:500;cursor:pointer}
.nav button.on{color:var(--pr);font-weight:600}
.nav button.on:before{content:"";position:absolute;top:0;left:24%;right:24%;height:3px;border-radius:0 0 3px 3px;background:var(--pr)}

/* page */
.content{flex:1;overflow-y:auto;padding:16px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.content::-webkit-scrollbar{display:none}
.content.chatc{display:flex;flex-direction:column;overflow:hidden}
.i{display:block;flex:none}
.card{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:14px;margin-bottom:12px}
.card.list{padding:0;overflow:hidden}
.card.list>*{border-top:1px solid var(--ln)}
.card.list>*:first-child{border-top:0}
.muted{color:var(--mu);font-size:12.5px}
.grow{flex:1;min-width:0}
.mono{font-family:ui-monospace,"IBM Plex Mono",Menlo,Consolas,monospace;font-size:13px}
.t-red{color:var(--red)}.t-grn{color:var(--grn)}.t-amb{color:var(--amb)}
.b{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:6px;white-space:nowrap}
.rowb{display:flex;justify-content:space-between;align-items:center;gap:8px}
.row2{display:flex;gap:8px;align-items:center}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.empty{text-align:center;color:var(--mu);padding:32px 14px;font-size:13.5px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.sec{display:flex;justify-content:space-between;align-items:center;margin:22px 2px 10px;font-size:15px;font-weight:600}
.sec span+span{font-size:12px;font-weight:600;color:var(--mu);background:var(--card2);border-radius:6px;padding:1px 8px}
.sh{display:flex;justify-content:space-between;align-items:center;margin:22px 2px 10px}
.sh h3{font-size:15px}
.lnk{border:0;background:none;color:var(--pr);font-size:13px;font-weight:600;cursor:pointer;padding:4px 2px}
.rxt{color:var(--pur);font-weight:600}
.si{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:none}
.arow{display:flex;align-items:center;gap:10px;width:100%;padding:12px 14px;color:var(--tx)}
.arow .grow{display:flex;flex-direction:column;gap:1px}
.arow b{font-size:14px;font-weight:600}
.amain{flex:1;min-width:0;display:flex;align-items:center;gap:12px;text-align:left;background:none;border:0;padding:0;color:inherit;font:inherit;cursor:pointer}
.amain:active{opacity:.65}
.aside{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.amt-s{font-size:12.5px;font-weight:700;white-space:nowrap}
.amt-s.red{color:var(--red)}.amt-s.amber{color:var(--amb)}
.abtn{display:inline-flex;align-items:center;gap:5px;min-height:34px;padding:5px 11px;border:0;border-radius:9px;font:inherit;font-size:12.5px;font-weight:700;white-space:nowrap;cursor:pointer}
.abtn:active{filter:brightness(.94)}
.abtn.order{background:var(--prc);color:var(--pr)}
.abtn.writeoff{background:var(--redc);color:var(--red)}
.abtn.batch{background:var(--ambc);color:var(--amb)}

/* home dashboard */
.sbox{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--ln2);border-radius:10px;padding:0 4px 0 12px;height:46px;color:var(--mu)}
.sbox:focus-within{border-color:var(--pr);box-shadow:0 0 0 3px var(--prc)}
.sbox input{flex:1;min-width:0;border:0;background:none;color:var(--tx);font:inherit;outline:none;height:100%}
.sfake{flex:1;display:flex;align-items:center;gap:8px;height:44px;background:none;border:0;color:var(--mu);font:inherit;text-align:left;cursor:pointer;min-width:0}
.sum{padding:16px}
.sum .lbl{font-size:12.5px;color:var(--mu);font-weight:500}
.sum .big{font-size:30px;font-weight:600;letter-spacing:-.02em;line-height:1.15;margin:2px 0 8px}
.mini3,.stats3{display:grid;grid-template-columns:repeat(3,1fr);margin-top:14px;padding-top:12px;border-top:1px solid var(--ln)}
.mini3>div,.stats3>div{padding:0 12px;border-left:1px solid var(--ln);min-width:0}
.mini3>div:first-child,.stats3>div:first-child{padding-left:0;border-left:0}
.mini3 span,.stats3 span{display:block;font-size:11.5px;color:var(--mu)}
.mini3 b,.stats3 b{display:block;font-size:clamp(13px,4vw,15px);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:clip}
.mini3>div:last-child,.stats3>div:last-child{padding-right:0}
.stiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.stile{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:12px;cursor:pointer;color:var(--tx)}
.stile b{font-size:24px;font-weight:600;line-height:1.1;margin-top:10px}
.stile .l{font-size:12px;color:var(--mu);font-weight:500}
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.qa button{display:flex;flex-direction:column;align-items:center;gap:8px;background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:12px 4px;font-size:12px;font-weight:600;color:var(--tx);cursor:pointer}
.qa .si{width:40px;height:40px;border-radius:12px;background:var(--prc);color:var(--pr)}

/* inventory table */
.toolbar{position:sticky;top:-16px;z-index:5;margin:-16px -16px 14px;padding:12px 16px 0;background:var(--card);border-bottom:1px solid var(--ln)}
.trow{display:flex;gap:10px}
.addb{width:46px;height:46px;border-radius:10px;border:0;background:var(--pr);color:var(--onpr);display:grid;place-items:center;cursor:pointer;flex:none}
.tabs{display:flex;gap:2px;margin-top:6px}
.tabs button{flex:1;display:flex;align-items:center;justify-content:center;gap:5px;padding:11px 0 10px;white-space:nowrap;border:0;border-bottom:2px solid transparent;background:none;color:var(--mu);font-size:13px;font-weight:600;cursor:pointer}
.tabs button.on{color:var(--pr);border-bottom-color:var(--pr)}
.tabs em{font-style:normal;font-size:11px;background:var(--card2);color:var(--mu);border-radius:6px;padding:0 6px;font-weight:600}
.tabs button.on em{background:var(--prc);color:var(--pr)}
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -16px 12px;padding:2px 16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:7px;border:1px solid var(--ln2);background:var(--card);color:var(--tx);border-radius:8px;padding:7px 11px;font-size:13px;font-weight:500;cursor:pointer}
.chip em{font-style:normal;font-size:11px;font-weight:600;color:var(--mu)}
.chip.on{background:var(--prc);color:var(--pr);border-color:var(--pr);font-weight:600}
.chip.on em{color:var(--pr)}
.tb{--cols:1fr 56px 96px;background:var(--card);border:1px solid var(--ln);border-radius:12px;margin-bottom:12px}
.th,.tr{display:grid;grid-template-columns:var(--cols);gap:10px;align-items:center;padding:0 14px}
.th{height:34px;background:var(--card2);border-radius:11px 11px 0 0;font-size:12px;font-weight:600;color:var(--mu)}
.tr{position:relative;min-height:60px;padding-top:9px;padding-bottom:9px;border-top:1px solid var(--ln);cursor:pointer}
.tr:active{background:var(--card2)}
.tr.static{cursor:default}.tr.static:active{background:none}
.tr.static .c1 .muted{white-space:normal}
.tr:before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:0 3px 3px 0;background:transparent}
.tr.s-red:before{background:var(--red)}
.tr.s-amber:before{background:var(--amf)}
.tb>*:last-child{border-radius:0 0 11px 11px}
.grp{display:flex;justify-content:space-between;padding:8px 14px;background:var(--card2);border-top:1px solid var(--ln);font-size:12px;font-weight:600;color:var(--mu)}
.r{text-align:right}
.c1,.c3{display:flex;flex-direction:column;gap:1px;min-width:0}
.c2{display:flex;flex-direction:column;align-items:flex-end;gap:1px}
.c1 .nm{display:block;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c1 .muted{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.num{font-size:15px;font-weight:600}
.mini{display:block;font-size:11.5px;font-weight:600}

/* medicine page */
.ph{padding:16px}
.phead{display:flex;gap:14px;align-items:flex-start}
.phead h2{line-height:1.25}
.ico{width:44px;height:44px;border-radius:12px;background:var(--prc);color:var(--pr);display:grid;place-items:center;flex:none}
.ico.lg{width:52px;height:52px}
.stats3 b{font-size:17px}
.kl{padding:2px 14px}
.kl>div{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-top:1px solid var(--ln);font-size:14px}
.kl>div:first-child{border-top:0}
.kl span{color:var(--mu)}
.kl b{font-weight:600;text-align:right}
.batch{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--ln)}
.batch:first-of-type{border-top:0}
.qtybox{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.qtybox b{font-size:17px}
.hero{display:flex;gap:14px;align-items:center}
.hero h2{line-height:1.2}

/* buttons and forms */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:10px;background:var(--pr);color:var(--onpr);padding:12px 16px;font-weight:600;font-size:14.5px;cursor:pointer;margin-top:12px;min-height:46px}
.btn:active{background:var(--pr2)}
.btn.tonal{background:var(--prc);color:var(--pr)}
.btn.ghost{background:var(--card);border:1px solid var(--ln2);color:var(--tx)}
.btn.sm{width:auto;padding:8px 12px;margin:0;font-size:13px;min-height:36px;flex:none}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btns{display:flex;gap:10px}
.btns .btn{padding:12px 8px}
.inp{width:100%;border:1px solid var(--ln2);background:var(--card);color:var(--tx);border-radius:10px;padding:12px 13px;font:inherit;outline:none;min-height:46px}
.inp:focus{border-color:var(--pr);box-shadow:0 0 0 3px var(--prc)}
label{display:block;font-size:12.5px;font-weight:500;color:var(--mu);margin:12px 2px 5px}
.seg{display:flex;background:var(--card2);border-radius:10px;padding:3px;gap:2px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;color:var(--mu);padding:9px 6px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer}
.seg button.on{background:var(--card);color:var(--pr);box-shadow:0 1px 2px rgba(14,26,51,.18)}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:44px;height:44px;border-radius:10px;border:1px solid var(--ln2);background:var(--card);color:var(--tx);font-size:20px;cursor:pointer;flex:none}
.stepper input{text-align:center}
.stepper.sm{gap:2px}
.stepper.sm button{width:32px;height:32px;font-size:17px;border-radius:8px}
.stepper.sm span{min-width:34px;text-align:center;font-weight:600}
.note{display:flex;gap:9px;align-items:flex-start;border-radius:10px;padding:10px 12px;font-size:12.5px;margin-bottom:12px;line-height:1.4}
.note.info{background:var(--bluc);color:var(--blu)}
.note.warn{background:var(--purc);color:var(--pur)}
.tblw{overflow-x:auto;border:1px solid var(--ln);border-radius:12px;background:var(--card)}
.tbl{border-collapse:collapse;width:100%;font-size:12.5px;white-space:nowrap}
.tbl th{background:var(--card2);text-align:left;padding:9px 11px;color:var(--mu);font-weight:600}
.tbl td{padding:9px 11px;border-top:1px solid var(--ln)}
.tl{display:flex;gap:12px;padding:12px 14px;align-items:flex-start}
.tl b{font-size:14px;font-weight:600}
.tm{font-size:12px;flex:none}
.bub{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:none}
.lrow{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:12px;margin-bottom:10px;cursor:pointer;color:var(--tx);width:100%;text-align:left}
.hero.deep{background:var(--pr);color:var(--onpr);border:0}
.hero.deep h2{font-size:26px}
.hero.deep .sm{font-size:12.5px;opacity:.85}
.hero.deep .bub{background:rgba(255,255,255,.18);color:inherit;width:44px;height:44px}

/* sales counter */
.res{margin-top:8px;margin-bottom:0}
.ci{padding:12px 14px}
.ci .r1{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.ci .r1 .ibtn{width:32px;height:32px;margin:-4px -6px 0 0}
.ci .r2{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
.ci .amt{font-size:15px;font-weight:600}
.ci2{display:flex;align-items:center;gap:10px;padding:12px 14px}
.checkout{position:sticky;bottom:0;z-index:4;display:flex;align-items:center;justify-content:space-between;gap:14px;margin:8px -16px -16px;padding:12px 16px;background:var(--card);border-top:1px solid var(--ln)}
.checkout .tot{display:block;font-size:20px;font-weight:600;line-height:1.2}
.checkout .btn{width:auto;margin:0;flex:1;max-width:200px}

/* analytics */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.kpi{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:12px 14px}
.kpi span{font-size:12px;color:var(--mu);font-weight:500}.kpi[data-a]{cursor:pointer}.kpi[data-a]:focus-visible{outline:2px solid var(--pr);outline-offset:2px}#fper{overflow-x:auto}#fper button{flex:1 0 auto;white-space:nowrap}
.kpi b{display:block;font-size:19px;font-weight:600;margin-top:3px}
.kpi.main{grid-column:1/3;border:0;background:var(--pr);color:var(--onpr);padding:16px}
.kpi.main span{color:inherit;opacity:.85}
.kpi.main b{font-size:28px}
.kpi.rowk{grid-column:1/3;display:flex;justify-content:space-between;align-items:center}
.kpi.rowk b{margin:0}
.ax{fill:var(--mu);font-size:10px}
.hbar{display:flex;align-items:center;gap:8px;margin:8px 0;font-size:13px}
.hbar .lbl{width:132px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar .trk{flex:1;height:8px;background:var(--card2);border-radius:4px;overflow:hidden;display:block}
.hbar .trk i{display:block;height:100%;background:var(--pr);border-radius:4px}
.hbar .n{width:34px;text-align:right;font-weight:600}
.legend{display:flex;flex-direction:column;gap:5px;font-size:12.5px;flex:1}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}

/* finance */
.chg{display:block;font-style:normal;font-size:11.5px;font-weight:600;margin-top:4px;color:var(--mu)}
.chg.up{color:var(--grn)}.chg.dn{color:var(--red)}.chg.am{color:var(--amb)}
.kpi .meta{display:block;font-style:normal;font-size:12px;margin-top:2px}
.kpi.main .chg,.kpi.main .meta{color:inherit;opacity:.9}
.fsub{display:flex;flex-direction:column;align-items:center;text-align:center;gap:1px;margin:0 2px 12px}
.fsub b{font-size:14px;font-weight:600}
.fsub span{font-size:12px;color:var(--mu)}
.fnote{font-size:12.5px;color:var(--mu);margin-top:2px}
.fin-go{cursor:pointer}
.sum.fin-go:active{background:var(--card2)}
.flink{display:inline-flex;align-items:center;gap:1px;margin-left:8px;font-weight:600;color:var(--pr)}
.bhero .flink{color:#fff}
.sgm{display:flex;border:1px solid var(--ln2);border-radius:999px;overflow:hidden;margin-bottom:14px;background:var(--card)}
.sgm button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;height:42px;border:0;border-left:1px solid var(--ln2);background:none;color:var(--tx);font-size:14px;font-weight:500;cursor:pointer}
.sgm button:first-child{border-left:0}
.sgm button.on{background:var(--prc)}
.pnav{margin:0 0 6px}
.pnav .pl{text-align:center;font-size:17px;font-weight:600;line-height:1.3}
.pnav .prow{display:flex;align-items:center;justify-content:space-between;min-height:44px}
.pnav .lnk{background:none;border:0;color:var(--pr);font-size:14px;font-weight:600;cursor:pointer;padding:8px}
.pnav .nb{width:44px;height:44px;display:grid;place-items:center;border:0;background:none;color:var(--tx);border-radius:50%;cursor:pointer}
.pnav .nb:active{background:var(--prc)}
.pnav .nb:disabled{opacity:.3;cursor:default}

/* register checks: inline hints, expiry field, callouts */
.req{color:var(--red);font-style:normal;font-weight:700}
.fhint{display:flex;align-items:flex-start;gap:6px;font-size:12.5px;line-height:1.4;margin:6px 2px 0;color:var(--mu)}
.fhint:empty{display:none}
.fhint svg{flex:none;margin-top:2px}
.fhint.ok{color:var(--grn)}.fhint.warn{color:var(--amb)}.fhint.bad{color:var(--red)}
.inp.err{border-color:var(--red);box-shadow:0 0 0 3px var(--redc)}
/* dropdown fields (Category, Supplier) and their popup list */
.ddbtn{display:flex;align-items:center;justify-content:space-between;gap:8px;text-align:left;cursor:pointer}
.ddbtn .ddv{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ddbtn .ddv.ph{color:var(--mu)}
.ddbtn svg{flex:none;color:var(--mu)}
.dd.err .ddbtn{border-color:var(--red);box-shadow:0 0 0 3px var(--redc)}
.ddsearch{display:flex;align-items:center;gap:8px;margin:12px 0 4px;padding:0 12px;border:1px solid var(--ln2);border-radius:12px;background:var(--card2);color:var(--mu)}
.ddsearch:focus-within{border-color:var(--pr);box-shadow:0 0 0 3px var(--prc)}
.ddsearch input{flex:1;min-width:0;border:0;background:none;color:var(--tx);font:inherit;padding:12px 0;outline:none}
.ddlist{display:flex;flex-direction:column;gap:2px;margin:10px -6px 0;padding:0 6px;max-height:min(46vh,360px);overflow:auto}
.ddrow{display:flex;align-items:center;gap:12px;width:100%;min-height:54px;padding:9px 10px;border:0;border-radius:12px;background:none;color:var(--tx);font:inherit;text-align:left;cursor:pointer}
.ddrow:hover{background:var(--card2)}
.ddrow:focus-visible{outline:none;box-shadow:0 0 0 3px var(--prc)}
.ddrow b{display:block;font-size:14.5px;font-weight:600}
.ddrow .muted{display:block;margin-top:1px;font-size:12.5px}
.ddrow.on{background:var(--prc);color:var(--pr)}
.ddrow.on .muted{color:inherit;opacity:.8}
.ddav{flex:none;display:grid;place-items:center;width:38px;height:38px;border-radius:50%;font-size:14px;font-weight:700;color:var(--c,var(--pr));background:color-mix(in srgb,var(--c,var(--pr)) 15%,transparent)}
.ddnone{padding:24px 8px;text-align:center;color:var(--mu);font-size:13.5px}
.ddadd{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:46px;margin-top:12px;border:1.5px dashed var(--pr);border-radius:12px;background:none;color:var(--pr);font:inherit;font-weight:600;cursor:pointer}
.ddadd:hover{background:var(--prc)}
/* home: cash vs credit split, drawer line, money at risk */
.cs{margin-top:12px}
.csbar{display:flex;gap:2px;height:8px;border-radius:99px;overflow:hidden;background:var(--card2)}
.csbar i{display:block;height:100%;border-radius:99px}
.csbar .cash{background:var(--grn)}.csbar .cred{background:var(--pur)}
.csrow{display:flex;justify-content:space-between;gap:10px;margin-top:8px;font-size:12.5px;color:var(--mu)}
.csrow>span{display:flex;align-items:center;gap:6px;min-width:0}
.csrow b{color:var(--tx);font-weight:600;white-space:nowrap}
.csrow .dot{flex:none;width:8px;height:8px;border-radius:50%}
.csrow .dot.cash{background:var(--grn)}.csrow .dot.cred{background:var(--pur)}
.csbar .mob,.csrow .dot.mob{background:#0e8fb0}.csbar .bank,.csrow .dot.bank{background:var(--amf)}
.csrow{flex-wrap:wrap;row-gap:4px}
.note.amb{background:var(--ambc);color:var(--amb)}
.rcpt{padding:12px 14px}.rcpt.ret{opacity:.8}
.rcpt .rl{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:2px 0}
.rcpt .rlines{margin:8px 0 10px}
.rfoot{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.rchips{display:flex;gap:6px;flex-wrap:wrap}
.strike{text-decoration:line-through;color:var(--mu)}
.prow{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--ln)}
.prow:first-of-type{border-top:0}
.prow label{margin:0;flex:1;color:var(--tx);font-weight:600;font-size:14px}
.prow .inp{width:130px;min-height:42px;text-align:right}
.remain{display:flex;align-items:center;gap:6px;border-radius:10px;padding:9px 12px;font-size:13px;margin-top:8px}
.remain.ok{background:var(--grnc);color:var(--grn)}.remain.bad{background:var(--ambc);color:var(--amb)}
.linkb{border:0;background:none;color:var(--pr);font-weight:600;font-size:13px;padding:6px 0;cursor:pointer;margin-top:4px;display:block}
.rxcard{border:1px solid var(--ln);border-radius:12px;padding:12px;margin-bottom:10px;background:var(--card)}
.rxcard .inp{min-height:42px}.rxph{display:flex;align-items:center;gap:10px;margin-top:12px}
.thumb{width:56px;height:56px;object-fit:cover;border-radius:8px;border:1px solid var(--ln)}
/* Rx log v2 */
.rxg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rxg .seg{margin:0;height:46px}.rxg .seg button{padding:0}
.rxcard .rxg .seg{height:42px}
textarea.inp{resize:none;line-height:1.4}
.rxsec{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--mu);margin:16px 2px 0}
.rxauto{display:flex;gap:8px;align-items:flex-start;font-size:12px;color:var(--mu);margin-top:12px;line-height:1.4}.rxauto svg{margin-top:1px}
.rxchips{display:flex;gap:8px;overflow-x:auto;margin:0 -16px 12px;padding:2px 16px;scrollbar-width:none}.rxchips::-webkit-scrollbar{display:none}
.rxchips .chp{flex:none;white-space:nowrap;min-height:36px;padding:6px 13px}
.rxsum{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:14px 2px 0;min-height:22px}
.rxe{padding:12px}.rxe .rowb{align-items:flex-start}
.rxbd{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.rxln{margin-top:6px;font-size:13.5px}
.rxe details{margin-top:8px;border-top:1px dashed var(--ln2);padding-top:2px}
.rxe summary{display:flex;align-items:center;gap:6px;cursor:pointer;color:var(--pr);font-weight:600;font-size:13px;list-style:none;padding:8px 0;min-height:36px}
.rxe summary::-webkit-details-marker{display:none}.rxe summary svg{transition:transform .15s}.rxe details[open] summary svg{transform:rotate(180deg)}
.rxkv{display:grid;grid-template-columns:104px 1fr;gap:7px 10px;font-size:13px;margin:4px 0}
.rxkv dt{color:var(--mu);font-size:12px;padding-top:1px}.rxkv dd{margin:0;overflow-wrap:anywhere}
.rxhist{border-left:2px solid var(--ln2);margin:8px 0 2px 4px;padding-left:12px;font-size:12.5px}.rxhist>div{margin-bottom:10px}.rxhist s{color:var(--mu)}
.rxact{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.dbar{display:flex;gap:8px;align-items:center;margin-bottom:10px}.dbar .inp{flex:1}
.cpick .ddbtn{min-height:52px}.cpick .who{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.cpick .who .grow{display:flex;flex-direction:column;min-width:0}.cpick .ddav{width:32px;height:32px;font-size:13px}
.cpanel{margin-top:8px;border:1px solid var(--ln);border-radius:12px;padding:8px;background:var(--card)}
.cpanel .ddsearch{margin:0 0 6px}.cpanel .ddlist{margin:0;padding:0;max-height:230px}
.ddrow .grow,.cpick .grow{flex:1;min-width:0}.owe{color:var(--red)!important}
.rhead{display:flex;align-items:center;gap:12px;margin-bottom:14px}.rhead h3{margin:0}
.rhead .ric{width:44px;height:44px;border-radius:14px;background:var(--redc);color:var(--red);display:grid;place-items:center;flex:none}
.ritems{border:1px solid var(--ln);border-radius:12px;padding:2px 14px}
.ritems .rl{padding:9px 0;border-top:1px solid var(--ln);font-size:13.5px}.ritems .rl:first-child{border-top:0}
.ritems .rtot{display:flex;justify-content:space-between;padding:10px 0;border-top:1px solid var(--ln);font-weight:600}
.rsec{display:flex;justify-content:space-between;font-size:12.5px;font-weight:600;color:var(--mu);margin:18px 2px 8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chp{border:1px solid var(--ln2);background:var(--card);color:var(--tx);border-radius:99px;padding:8px 14px;min-height:40px;font:inherit;font-size:13.5px;font-weight:500;cursor:pointer}
.chp.on{background:var(--prc);border-color:var(--pr);color:var(--pr);font-weight:600}
.swrow{display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px solid var(--ln);border-radius:12px;padding:12px 14px;margin-top:18px}
.swrow b{display:block;font-size:14px}.swrow .muted{display:block;margin-top:2px}
.sw{appearance:none;-webkit-appearance:none;width:46px;height:28px;border-radius:99px;background:var(--ln2);position:relative;cursor:pointer;flex:none;border:0;margin:0;transition:background .15s}
.sw:after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .15s}
.sw:checked{background:var(--pr)}.sw:checked:after{transform:translateX(18px)}.sw:focus-visible{outline:none;box-shadow:0 0 0 3px var(--prc)}
.eff{display:flex;flex-direction:column;gap:8px;margin:16px 2px 0;font-size:13px;color:var(--mu)}
.eff div{display:flex;gap:8px;align-items:flex-start;line-height:1.4}.eff div[hidden]{display:none}.eff svg{flex:none;color:var(--grn);margin-top:1px}
.rbtns{display:flex;gap:10px;margin-top:18px}.rbtns .btn{margin:0;flex:1}
.chk{display:flex;gap:10px;align-items:center;margin-top:14px}.chk input{width:20px;height:20px;flex:none}
.chk label{margin:0;color:var(--tx);font-size:13.5px}

.drw{display:flex;align-items:center;gap:10px;margin-top:12px;padding:10px 12px;border-radius:12px;background:var(--grnc);color:var(--grn)}
.drw .t{flex:1;min-width:0;font-size:12.5px;font-weight:600;line-height:1.3}
.drw .t small{display:block;margin-top:1px;font-size:11.5px;font-weight:500;opacity:.85}
.drw b{font-size:16px;font-weight:700;white-space:nowrap}
.drw.bad{background:var(--redc);color:var(--red)}
.drw.inf{background:var(--prc);color:var(--pr)}
.mny{display:block;margin-top:6px;font-size:11.5px;line-height:1.3;font-weight:500;color:var(--mu)}
.mny .amt{display:block;font-size:12.5px;font-weight:700}
.stile .mny.red .amt{color:var(--red)}.stile .mny.amber .amt{color:var(--amb)}.stile .mny.blue .amt{color:var(--blu)}
.bt .mny{color:inherit;opacity:.92}
.btn.dng{background:var(--red);color:var(--onpr)}
.expw{position:relative;display:flex;gap:8px;align-items:center}
.expw .inp{flex:1;letter-spacing:.3px}
.dpick{position:absolute;right:0;bottom:0;width:1px;height:1px;opacity:0;pointer-events:none}
.callout{border-radius:14px;padding:14px;margin:14px 0 2px;border:1px solid var(--ln2);background:var(--card2);animation:fade .18s}
.callout.amber{background:var(--ambc);border-color:transparent}
.callout.red{background:var(--redc);border-color:transparent}
.callout .ch{display:flex;gap:10px;align-items:flex-start}
.callout .cico{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--card);color:var(--mu)}
.callout.amber .cico{color:var(--amb)}.callout.red .cico{color:var(--red)}
.callout b{display:block;font-size:14.5px;font-weight:700}
.callout p{margin:3px 0 0;font-size:13px;line-height:1.45;color:var(--tx);opacity:.82}
.callout .acts{display:grid;gap:8px;margin-top:12px}
.callout .acts .btn{margin:0}
.seg.err{box-shadow:0 0 0 3px var(--redc)}
select.inp.err{border-color:var(--red)}

/* stocktake, orders, settings */
.st{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:9px 10px;margin-bottom:8px}
.st .inp{width:84px;flex:none;text-align:center;padding:9px 8px;min-height:40px}
.st .diff{width:62px;text-align:center;flex:none}
.sticky{position:sticky;top:0;z-index:5;box-shadow:0 6px 16px rgba(14,26,51,.12)}
.pol{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--ln)}
.chk{width:26px;height:26px;border-radius:7px;border:2px solid var(--ln2);background:var(--card);color:var(--onpr);display:grid;place-items:center;cursor:pointer;flex:none}
.chk.on{background:var(--pr);border-color:var(--pr)}
.sw{width:46px;height:28px;border-radius:14px;border:0;background:var(--ln2);position:relative;cursor:pointer;flex:none;transition:.2s}
.sw:after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:var(--pr)}
.sw.on:after{left:21px}

/* chat */
.chatlog{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:6px 0;min-height:0}
.msg{max-width:88%;padding:10px 13px;border-radius:12px;font-size:14px;line-height:1.45}
.msg.bot{background:var(--card);border:1px solid var(--ln);border-bottom-left-radius:4px;align-self:flex-start}
.msg.me{background:var(--pr);color:var(--onpr);border-bottom-right-radius:4px;align-self:flex-end}
.dots span{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--mu);margin:0 2px;animation:bl 1s infinite}
.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
@keyframes bl{0%,80%,100%{opacity:.25}40%{opacity:1}}
.cin{display:flex;gap:8px;padding-top:8px}
.send{width:48px;border:0;border-radius:10px;background:var(--pr);color:var(--onpr);display:grid;place-items:center;cursor:pointer;flex:none}

/* drawer */
#drawerwrap{position:absolute;inset:0;z-index:42;pointer-events:none}
#drawerwrap.open{pointer-events:auto}
.dscrim{position:absolute;inset:0;background:rgba(8,16,40,.5);opacity:0;transition:opacity .2s}
.open .dscrim{opacity:1}
.dpanel{position:absolute;top:0;bottom:0;left:0;width:min(308px,86%);background:var(--card);display:flex;flex-direction:column;transform:translateX(-100%);transition:transform .22s ease;box-shadow:var(--sh)}
.open .dpanel{transform:none}
.dhead{display:flex;align-items:center;gap:12px;padding:16px 10px 12px 16px}
.dhead .t{flex:1;min-width:0}
.dhead b{display:block;font-size:16px;font-weight:600;line-height:1.2}
.dhead span{font-size:12px;color:var(--mu)}
.logo{width:40px;height:40px;border-radius:10px;background:var(--pr);color:var(--onpr);display:grid;place-items:center;flex:none}
.duser{display:flex;align-items:center;gap:10px;margin:0 12px 4px;padding:10px;border:1px solid var(--ln);border-radius:12px;background:var(--card2)}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--pr);color:var(--onpr);display:grid;place-items:center;font-weight:600;flex:none}
.duser b{display:block;font-size:14px;font-weight:600;line-height:1.2}
.duser .m{font-size:12px;color:var(--mu)}
.dnav{flex:1;overflow-y:auto;padding:2px 12px;scrollbar-width:none}
.dnav::-webkit-scrollbar{display:none}
.dg{font-size:12px;font-weight:600;color:var(--mu);margin:14px 10px 6px}
.ditem{position:relative;display:flex;align-items:center;gap:12px;width:100%;height:44px;padding:0 10px;border:0;border-radius:10px;background:none;color:var(--tx);font-size:14.5px;font-weight:500;text-align:left;cursor:pointer}
.ditem:active{background:var(--card2)}
.ditem.on{background:var(--prc);color:var(--pr);font-weight:600}
.ditem.on:before{content:"";position:absolute;left:-12px;top:10px;bottom:10px;width:3px;border-radius:0 3px 3px 0;background:var(--pr)}
.ditem em{font-style:normal;font-size:11px;font-weight:600;background:var(--card2);color:var(--mu);border-radius:8px;padding:1px 7px}
.ditem.on em{background:var(--card);color:var(--pr)}
.dfoot{padding:12px;border-top:1px solid var(--ln)}
.dsync{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--ln);border-radius:12px;margin-bottom:10px}
.dsync i{width:9px;height:9px;border-radius:50%;background:var(--grn);flex:none}
.dsync.off i{background:var(--amf)}
.dsync b{display:block;font-size:13px;font-weight:600;line-height:1.25}
.dsync span{font-size:12px;color:var(--mu)}
.ver{font-size:11.5px;color:var(--mu);text-align:center;margin-top:6px}

/* sheet, toast, notification */
.sheetwrap{position:absolute;inset:0;pointer-events:none;z-index:40}
.sheetwrap>*{pointer-events:auto}
.scrim{position:absolute;inset:0;background:rgba(8,16,40,.5);animation:fade .15s}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--card);border-radius:20px 20px 0 0;padding:22px 16px calc(18px + env(safe-area-inset-bottom));max-height:90%;overflow:auto;animation:up .22s ease;box-shadow:0 -10px 30px rgba(0,0,0,.25)}
.sheet:before{content:"";display:block;width:36px;height:4px;border-radius:2px;background:var(--ln2);margin:-10px auto 14px}
.sheet h3{font-size:17px;margin-bottom:2px}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@keyframes fade{from{opacity:0}}
.notif{position:absolute;left:10px;right:10px;top:10px;z-index:50;transform:translateY(-150%);visibility:hidden;transition:transform .35s,visibility 0s .35s;pointer-events:none}
.notif.show{transform:none;pointer-events:auto;visibility:visible;transition:transform .35s}
.nbox{display:flex;gap:10px;align-items:flex-start;background:rgba(14,26,51,.97);color:#fff;border-radius:12px;padding:11px 12px;box-shadow:0 10px 26px rgba(0,0,0,.4);font-size:13px;line-height:1.35;cursor:pointer}
.nic{width:30px;height:30px;border-radius:8px;background:#1d4ed8;color:#fff;display:grid;place-items:center;flex:none}
.nbox .now{margin-left:auto;font-size:11px;opacity:.6;flex:none}
.toast{position:absolute;left:50%;bottom:78px;transform:translate(-50%,20px);background:#0e1a33;color:#fff;padding:10px 15px;border-radius:10px;font-size:13px;opacity:0;transition:.25s;z-index:60;max-width:88%;text-align:center;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* H4 + H5 */
.wpair{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.wcard{display:flex;flex-direction:column;align-items:flex-start;gap:3px;min-width:0;padding:12px;border:1px solid var(--ln);border-radius:12px;background:var(--card);color:var(--tx);font:inherit;text-align:left;cursor:pointer}
.wcard.bad{border-color:var(--red)}
.wcard .wh{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:var(--mu);line-height:1.25}
.wcard .wi{flex:none;display:inline-grid;place-items:center;width:28px;height:28px;border-radius:9px}
.wcard .wn{font-size:21px;font-weight:700;line-height:1.15;margin-top:6px;white-space:nowrap}
.wcard .ws{font-size:12px;line-height:1.3;color:var(--mu)}
.wcard .wlate{display:inline-block;margin-top:4px;padding:3px 8px;border-radius:99px;font-size:11.5px;font-weight:700;line-height:1.3}
.bento+.wpair{margin-top:12px}
.mini3.two,.bh-stats.two{grid-template-columns:repeat(2,1fr)}
.qa.n2{grid-template-columns:repeat(2,1fr)}
.lockd{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:64px 24px;color:var(--mu)}
.lockd svg{margin-bottom:6px}.lockd b{color:var(--tx);font-size:16px}.lockd span{font-size:13.5px}
/* status tones (kept last so they win over component defaults) */
.red{background:var(--redc);color:var(--red)}
.amber{background:var(--ambc);color:var(--amb)}
.green{background:var(--grnc);color:var(--grn)}
.blue{background:var(--bluc);color:var(--blu)}
.purple{background:var(--purc);color:var(--pur)}
/* money text only takes the tone colour, never the chip background */
.mny.red,.mny.amber,.mny.blue,.amt-s.red,.amt-s.amber{background:none}
.pri{background:var(--prc);color:var(--pr)}
.gray{background:var(--card2);color:var(--mu)}

/* ===================== MODERN LAYOUT ===================== */
:root{--shm:0 8px 24px rgba(29,78,216,.10)}
[data-theme=dark]{--shm:0 8px 24px rgba(0,0,0,.45)}
.meter{height:5px;border-radius:3px;background:var(--card2);overflow:hidden}
.meter i{display:block;height:100%;border-radius:3px;background:var(--pr)}
.meter i.red{background:var(--red)}
.meter i.amber{background:var(--amf)}

html[data-layout=modern] body{font-family:"Plus Jakarta Sans","Noto Sans Ethiopic",system-ui,-apple-system,"Segoe UI",Roboto,Nyala,sans-serif}
html[data-layout=modern] .phone{background:linear-gradient(180deg,#e6efff 0,#f4f7ff 300px)}
html[data-layout=modern][data-theme=dark] .phone{background:linear-gradient(180deg,#10204f 0,#0a1230 300px)}
html[data-layout=modern] h1,html[data-layout=modern] h2,html[data-layout=modern] h3,html[data-layout=modern] .sec{font-weight:800}
html[data-layout=modern] .content{padding:8px 16px 112px}
html[data-layout=modern] .content.chatc{padding-bottom:100px}
html[data-layout=modern] .toast{bottom:100px}

/* header */
.mh{flex:none;display:flex;align-items:center;gap:10px;padding:14px 16px 10px}
.mh .ht{flex:1;min-width:0}
.mh h1{font-size:21px;font-weight:800;letter-spacing:-.01em;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mh .hs{display:block;font-size:12px;font-weight:600;color:var(--mu);line-height:1.2}
.avbtn{width:44px;height:44px;border-radius:50%;border:0;flex:none;background:linear-gradient(145deg,#4f8dfb,#1d4ed8);color:#fff;font-weight:800;font-size:17px;cursor:pointer;box-shadow:0 8px 16px rgba(29,78,216,.35)}
.rbtn{width:42px;height:42px;border-radius:50%;border:0;background:var(--card);color:var(--tx);display:grid;place-items:center;position:relative;cursor:pointer;box-shadow:var(--shm);flex:none}
.rbtn:active{background:var(--card2)}
.rbtn.sq{border-radius:16px;width:50px;height:50px}
.sdot i{position:absolute;top:8px;right:8px;width:9px;height:9px;border-radius:50%;background:var(--grn);border:2px solid var(--card);box-sizing:content-box}
.sdot.off i{background:var(--amf)}
.sdot .cnt{top:auto;bottom:1px}
html[data-layout=modern] .offbar{margin:0 16px 4px;border:0;border-radius:12px}

/* floating dock with raised sell button */
.dock{position:absolute;left:14px;right:14px;bottom:12px;z-index:20;height:68px;display:flex;align-items:center;background:var(--card);border-radius:28px;box-shadow:0 14px 34px rgba(29,78,216,.20);padding:0 6px}
.dock button{flex:1;height:100%;border:0;background:none;color:var(--mu);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10.5px;font-weight:700;cursor:pointer;border-radius:20px}
.dock button.on{color:var(--pr)}
.dock .dsell{flex:none;width:62px;height:62px;margin:-30px 8px 0;border-radius:50%;background:linear-gradient(145deg,#4f8dfb,#1d4ed8);color:#fff;box-shadow:0 0 0 7px var(--card),0 12px 24px rgba(29,78,216,.45)}
.dock .dsell.on{background:linear-gradient(145deg,#3b82f6,#1e3a8a)}

/* home: tiles */
.bento{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.bhero{grid-column:1/3;position:relative;overflow:hidden;border-radius:26px;padding:18px;color:#fff;background:linear-gradient(150deg,#4f8dfb,#1d4ed8 62%,#1e3a8a);box-shadow:0 18px 36px rgba(29,78,216,.34)}
.bhero:before{content:"";position:absolute;right:-50px;top:-50px;width:170px;height:170px;border-radius:50%;background:rgba(255,255,255,.10)}
.bhero:after{content:"";position:absolute;right:30px;bottom:-70px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.07)}
.bhero>*{position:relative;z-index:1}
.bh-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.bhero .lbl{font-size:12.5px;font-weight:600;opacity:.85}
.bhero .big{font-size:32px;font-weight:800;letter-spacing:-.02em;line-height:1.15;margin:2px 0 8px}
.bh-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.bh-stats>div{background:rgba(255,255,255,.15);border-radius:14px;padding:9px 10px;min-width:0}
.bh-stats span{display:block;font-size:11px;opacity:.85}
.bh-stats b{display:block;font-size:14px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bt{display:flex;flex-direction:column;gap:2px;text-align:left;border:0;border-radius:22px;padding:16px;min-height:118px;cursor:pointer;box-shadow:var(--shm);position:relative;background:var(--card);color:var(--tx)}
.bt .bi{width:38px;height:38px;border-radius:12px;background:var(--card);display:grid;place-items:center;margin-bottom:10px}
.bt b{font-size:28px;font-weight:800;line-height:1}
.bt .l{font-size:12.5px;font-weight:600;color:var(--mu)}
.bt.cta{background:var(--pr);color:var(--onpr)}
.bt.red{background:var(--redc);color:var(--red)}
.bt.amber{background:var(--ambc);color:var(--amb)}
.bt.blue{background:var(--bluc);color:var(--blu)}
.bt.red .l,.bt.amber .l,.bt.blue .l{color:inherit;opacity:.85}
.bt.cta .bi{background:rgba(255,255,255,.2);color:inherit}
.bt.cta b{font-size:18px;margin-top:2px}
.bt.cta .l{color:inherit;opacity:.85}
.qa2{display:flex;justify-content:space-between;gap:8px;margin-top:20px}
.qa2 button{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;background:none;border:0;font-size:12px;font-weight:700;color:var(--tx);cursor:pointer}
.qc{width:56px;height:56px;border-radius:20px;background:var(--card);box-shadow:var(--shm);display:grid;place-items:center;color:var(--pr)}
.hscroll{display:flex;gap:12px;overflow-x:auto;margin:0 -16px;padding:2px 16px 10px;scroll-snap-type:x mandatory;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.ac{flex:none;width:228px;scroll-snap-align:start;display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;background:var(--card);border:0;border-top:4px solid var(--pr);border-radius:20px;padding:14px;box-shadow:var(--shm);color:var(--tx);cursor:pointer}
.ac[data-t=red]{border-top-color:var(--red)}
.ac[data-t=amber]{border-top-color:var(--amf)}
.ac .si{margin-bottom:6px}
.ac b{font-size:14px;font-weight:700}
.ac .muted{min-height:34px}
.ac .go{margin-top:6px;display:flex;align-items:center;gap:2px;font-size:12.5px;font-weight:700;color:var(--pr)}
.ac .amain{width:100%;flex:1;flex-direction:column;align-items:flex-start;gap:4px}
.ac .acf{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;margin-top:10px}
.bhero .cs{margin-top:14px}
.bhero .csbar{background:rgba(255,255,255,.2)}
.bhero .csbar .cash,.bhero .csrow .dot.cash{background:#7ee2b0}
.bhero .csbar .cred,.bhero .csrow .dot.cred{background:#d4c2ff}
.bhero .csbar .mob,.bhero .csrow .dot.mob{background:#8fdcf0}.bhero .csbar .bank,.bhero .csrow .dot.bank{background:#ffd98a}
.bhero .csrow{color:rgba(255,255,255,.85)}.bhero .csrow b{color:#fff}
.bhero .drw{background:rgba(255,255,255,.16);color:#fff;border-radius:14px}
.allclear{flex:1;text-align:center;padding:26px 14px;color:var(--mu);background:var(--card);border-radius:20px;box-shadow:var(--shm)}

/* inventory: card grid */
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:6px}
.mc{display:flex;flex-direction:column;gap:2px;text-align:left;background:var(--card);border:0;border-radius:20px;padding:14px;box-shadow:var(--shm);color:var(--tx);cursor:pointer;min-width:0}
.mc:active{background:var(--card2)}
.mc-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}
.mc .ico{width:38px;height:38px;border-radius:12px}
.mc .nm{font-size:14.5px;font-weight:700;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mc .muted{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mc-bot{display:flex;justify-content:space-between;align-items:flex-end;margin:10px 0 8px}
.qn{font-size:26px;font-weight:800;line-height:1}
.mc .u{font-size:11px;color:var(--mu);margin-left:4px}
.mx{font-size:12px;font-weight:700}

/* shared components, softer and rounder */
html[data-layout=modern] .card{border:0;border-radius:20px;box-shadow:var(--shm)}
html[data-layout=modern] .tb{border:0;border-radius:18px;box-shadow:var(--shm)}
html[data-layout=modern] .th{border-radius:18px 18px 0 0}
html[data-layout=modern] .tb>*:last-child{border-radius:0 0 18px 18px}
html[data-layout=modern] .btn{border-radius:14px;font-weight:700;box-shadow:0 8px 18px rgba(29,78,216,.28)}
html[data-layout=modern] .btn.tonal,html[data-layout=modern] .btn.ghost,html[data-layout=modern] .btn:disabled{box-shadow:none}
html[data-layout=modern] .btn.ghost{border:0;background:var(--card);box-shadow:var(--shm)}
html[data-layout=modern] .inp{border-radius:14px;border:1px solid var(--ln)}
html[data-layout=modern] .chip{border:0;border-radius:20px;box-shadow:var(--shm);padding:8px 13px;font-weight:600}
html[data-layout=modern] .chip.on{background:var(--pr);color:var(--onpr)}
html[data-layout=modern] .chip.on em{color:inherit;opacity:.85}
html[data-layout=modern] .seg{border-radius:16px;background:var(--card);box-shadow:var(--shm)}
html[data-layout=modern] .seg button{border-radius:12px}
html[data-layout=modern] .seg button.on{background:var(--pr);color:var(--onpr);box-shadow:none}
html[data-layout=modern] .ddsearch,html[data-layout=modern] .ddadd{border-radius:14px}
html[data-layout=modern] .ddrow{border-radius:16px}
html[data-layout=modern] .sbox{border:0;border-radius:18px;box-shadow:var(--shm);height:50px}
html[data-layout=modern] .addb{width:50px;height:50px;border-radius:16px;box-shadow:0 8px 18px rgba(29,78,216,.3)}
html[data-layout=modern] .toolbar{position:static;margin:0 0 14px;padding:0;background:none;border:0}
html[data-layout=modern] .tabs{background:var(--card);border-radius:16px;padding:4px;gap:4px;box-shadow:var(--shm);margin-top:0}
html[data-layout=modern] .tabs button{border:0;border-radius:12px;padding:10px 0}
html[data-layout=modern] .tabs button.on{background:var(--pr);color:var(--onpr)}
html[data-layout=modern] .tabs button.on em{background:rgba(255,255,255,.25);color:inherit}
html[data-layout=modern] .note{border-radius:14px}
html[data-layout=modern] .checkout{bottom:10px;margin:12px 0 0;border:0;border-radius:20px;box-shadow:0 12px 30px rgba(29,78,216,.20)}
html[data-layout=modern] .sheet{border-radius:28px 28px 0 0}
html[data-layout=modern] .dpanel{border-radius:0 28px 28px 0}
html[data-layout=modern] .ditem{border-radius:14px}
html[data-layout=modern] .duser,html[data-layout=modern] .dsync{border-radius:16px}
html[data-layout=modern] .lrow,html[data-layout=modern] .st,html[data-layout=modern] .kpi{border:0;border-radius:18px;box-shadow:var(--shm)}
html[data-layout=modern] .kpi.main{background:linear-gradient(150deg,#4f8dfb,#1d4ed8 62%,#1e3a8a)}
html[data-layout=modern] .hero.deep{background:linear-gradient(150deg,#4f8dfb,#1d4ed8 62%,#1e3a8a)}
html[data-layout=modern] .msg{border-radius:18px}
html[data-layout=modern] .msg.bot{border:0;box-shadow:var(--shm)}
html[data-layout=modern] .msg.me{background:linear-gradient(150deg,#4f8dfb,#1d4ed8)}
html[data-layout=modern] .send{border-radius:16px;width:50px}
html[data-layout=modern] .tblw{border:0;border-radius:18px;box-shadow:var(--shm)}
/* medicine page hero */
html[data-layout=modern] .ph{background:linear-gradient(150deg,#4f8dfb,#1d4ed8 66%,#1e3a8a);color:#fff;border-radius:26px;box-shadow:0 18px 36px rgba(29,78,216,.32)}
html[data-layout=modern] .ph .muted{color:rgba(255,255,255,.82)}
html[data-layout=modern] .ph .ico{background:rgba(255,255,255,.18);color:#fff}
html[data-layout=modern] .ph .stats3{border-top-color:rgba(255,255,255,.25)}
html[data-layout=modern] .ph .stats3>div{border-left-color:rgba(255,255,255,.25)}
html[data-layout=modern] .ph .stats3 span{color:rgba(255,255,255,.82)}
html[data-layout=classic] .content{padding-bottom:112px}
html[data-layout=classic] .content.chatc{padding-bottom:100px}
html[data-layout=classic] .toast{bottom:100px}
html[data-layout=classic] .checkout{bottom:10px;margin:12px 0 0;border:1px solid var(--ln);border-radius:14px;box-shadow:0 10px 24px rgba(15,31,61,.12)}
html[data-layout=classic] .dock{border:1px solid var(--ln)}
/* S4 credit limit · S5 receipt · S6 discount */
.cmet{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--card2);font-size:12.5px}
.cmet .meter{margin:7px 0 2px}.cmet .fhint{margin:6px 0 0}
.ric.amb{background:var(--ambc);color:var(--amb)}.ric.grn{background:var(--grnc);color:var(--grn)}
.rsn{display:flex;flex-direction:column;gap:8px;border-radius:12px;background:var(--redc);color:var(--red);padding:12px;font-size:13px;margin-bottom:14px}
.rsn div{display:flex;gap:8px;align-items:flex-start;line-height:1.4}.rsn svg{flex:none;margin-top:1px}
.dq{display:flex;gap:6px;flex:none}.dchips{display:flex;flex-wrap:wrap;gap:8px}
.dsm{border:1px solid var(--ln);border-radius:12px;padding:2px 12px;margin-top:12px}
.dsm div{display:flex;justify-content:space-between;padding:6px 0;font-size:13.5px}
.dsm .dsg{color:var(--grn)}.dsm .dst{border-top:1px solid var(--ln);font-weight:700;font-size:15px}
.dgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.dgrid div{background:var(--card2);border-radius:10px;padding:9px 10px;min-width:0}.dgrid span{display:block;font-size:11.5px;color:var(--mu)}.dgrid b{font-size:13.5px}
.drow{display:flex;justify-content:space-between;gap:8px;font-size:13px;margin:10px 0 4px}
.rcdoc{background:#fff;color:#111a2e;border:1px solid var(--ln2);border-radius:12px;padding:16px;font-size:13px;margin-top:4px}
.rcdoc .rch{text-align:center;padding-bottom:10px;border-bottom:1px dashed #b9c0cf;margin-bottom:6px}
.rcdoc .rch b{display:block;font-size:16px}.rcdoc .rch>span{font-size:12px;color:#5a6a88}
.rcdoc .rcm{display:flex;justify-content:space-between;gap:8px;font-size:11.5px;color:#5a6a88;margin-top:8px;text-align:left}
.rcdoc .rcl{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px dotted #d5dae6}
.rcdoc .rcl small{display:block;color:#5a6a88;font-size:11.5px}
.rcdoc .rct{display:flex;justify-content:space-between;gap:10px;padding:3px 0}
.rcdoc .rct.big{font-size:16px;font-weight:700;border-top:1px dashed #b9c0cf;margin-top:6px;padding-top:9px}
.rcdoc .rcd{color:#0b7a43}.rcdoc .rcf{text-align:center;color:#5a6a88;font-size:11.5px;margin-top:12px}
/* C2 debt age · C3 reversal · C4 customer details */
.agebar{display:flex;height:8px;border-radius:99px;overflow:hidden;background:var(--card2);margin:10px 0 8px}
.agebar i{display:block;height:100%}.agebar i.g,.agedot.g{background:var(--grn)}.agebar i.a,.agedot.a{background:var(--amf)}.agebar i.r,.agedot.r{background:var(--red)}
.agecols{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.agecols div{background:var(--card2);border-radius:10px;padding:8px 10px;min-width:0}
.agecols span{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--mu);white-space:nowrap}
.agecols b{display:block;font-size:13.5px;margin-top:2px}
.agedot{display:inline-block;width:8px;height:8px;border-radius:50%;flex:none}
.ctags{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;font-size:13.5px;border-bottom:1px dotted var(--ln)}.kv:last-child{border:0}
.kv span{color:var(--mu);flex:none}.kv b{text-align:right;min-width:0;word-break:break-word}
textarea.inp{min-height:120px;resize:vertical;line-height:1.45}
.batch .lnk{padding:2px 0;margin-top:2px}
#chint .fhint{flex-wrap:wrap}
#prt{display:none}
@media print{.phone{display:none!important}body{display:block;background:#fff}#prt{display:block;width:80mm;margin:0 auto}#prt:has(.rcw58){width:58mm}#prt:has(.rcwa4){width:auto;max-width:190mm}#prt .rcdoc{border:0;padding:0}}
.rcdoc.rcw58{max-width:240px;margin-left:auto;margin-right:auto;font-size:11px}.rcdoc.rcw80{max-width:320px;margin-left:auto;margin-right:auto}.sgrp{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.sgrp .chip{cursor:default}


/* preview 8: sellable stock, at-risk lines, filter button, other names */
.fbtn{position:relative;flex:none;width:46px;height:46px;border:1px solid var(--ln2);border-radius:10px;background:var(--card);color:var(--tx);display:grid;place-items:center;cursor:pointer}
.fbtn i{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;border-radius:9px;background:var(--pr);color:var(--onpr);font:700 11px/18px system-ui;font-style:normal;text-align:center}
html[data-layout=modern] .fbtn{width:50px;height:50px;border:0;border-radius:16px;box-shadow:var(--shm)}
.rks{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:3px}
.rk{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;white-space:nowrap}
.rk.red{color:var(--red)}.rk.amber{color:var(--amb)}
.via{display:block;font-size:11.5px;font-weight:600;color:var(--pr);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mc .rks{margin-top:6px;flex-direction:column;gap:2px}
.wobox{display:flex;align-items:center;gap:12px;background:var(--redc);border-radius:16px;padding:12px 14px;margin-bottom:12px}
.wobox b{color:var(--red);font-size:14px}.wobox .abtn{flex:none}
.dym{margin-top:10px;font-size:14px}.dym .lnk{background:none;border:0;color:var(--pr);font-weight:700;font-size:14px;padding:0;text-decoration:underline}
.fch{margin:6px 0 14px;padding:0;overflow:visible;flex-wrap:wrap}
.tabs button{font-size:12px;gap:4px}

/* preview 9: scanner sheet, not-found, paging */
.vf{position:relative;height:150px;border-radius:18px;background:#0e1512;margin:4px 0 14px;display:grid;place-items:center;overflow:hidden;color:#cfe;font-size:12.5px}
.vf i{position:absolute;width:26px;height:26px;border:3px solid var(--pr)}
.vf .c1{top:14px;left:14px;border-right:0;border-bottom:0;border-radius:8px 0 0 0}.vf .c2{top:14px;right:14px;border-left:0;border-bottom:0;border-radius:0 8px 0 0}
.vf .c3{bottom:14px;left:14px;border-right:0;border-top:0;border-radius:0 0 0 8px}.vf .c4{bottom:14px;right:14px;border-left:0;border-top:0;border-radius:0 0 8px 0}
.vf .ln{position:absolute;left:22px;right:22px;height:2px;background:#ff5a4d;box-shadow:0 0 12px #ff5a4d;animation:scanln 2s ease-in-out infinite alternate}
@keyframes scanln{from{top:26px}to{top:122px}}
.vf span{position:relative;opacity:.8;padding:0 40px;text-align:center}
.simrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:12px 0 4px}
.simrow span{width:100%;font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--mu)}
.nf{text-align:center}.nfi{display:grid;place-items:center;width:56px;height:56px;margin:0 auto 8px;border-radius:50%;background:var(--ambc);color:var(--amb)}
.nfc{font:700 20px/1.2 ui-monospace,monospace;letter-spacing:1px;margin:6px 0 10px}
.more{display:flex;flex-direction:column;align-items:center;gap:10px;padding:16px 0 28px;color:var(--mu);font-size:13px}
.pbar{width:60%;max-width:220px;height:4px;border-radius:2px;background:var(--card2)}.pbar i{display:block;height:100%;border-radius:2px;background:var(--pr)}

/* preview 10: horizontal category chips */
.chips.hs{position:relative;flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;margin:0 -16px 12px;padding:2px 16px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;scrollbar-width:none;overscroll-behavior-x:contain}
.chips.hs::-webkit-scrollbar{display:none}
.chips.hs .chip{scroll-snap-align:center;white-space:nowrap}
.chip.add{border-style:dashed;border-color:var(--pr);color:var(--pr);background:transparent;font-weight:600}
.dd .chips.hs{margin:2px 0 4px;padding:3px 0 6px;-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent)}
.dd.err:has(.chips.hs){outline:2px solid var(--red);outline-offset:2px;border-radius:12px}

/* preview 11: orders */
.ordtools{display:flex;align-items:center;justify-content:space-between;margin:-4px 2px 10px}.ordtools .btn{width:auto;margin:0;padding:8px 14px}

<script>
'use strict';
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DAY=86400000, USER='Selam (Pharmacist)';
const T0=new Date();T0.setHours(0,0,0,0);
const addDays=n=>{const d=new Date(T0);d.setDate(d.getDate()+n);return d};
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const parseD=s=>{const p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2])};
const daysTo=s=>Math.round((parseD(s)-T0)/DAY);
/* DB5: Ethiopian calendar (ዓ.ም.) and fiscal year. CAL is 'gc' (Gregorian) or 'ec' (Ethiopian). */
var CAL='gc',XL=0;
const EMN=['Meskerem','Tikimt','Hidar','Tahsas','Tir','Yekatit','Megabit','Miazia','Ginbot','Sene','Hamle','Nehase','Pagume'],EMA=['መስከረም','ጥቅምት','ኅዳር','ታኅሣሥ','ጥር','የካቲት','መጋቢት','ሚያዝያ','ግንቦት','ሰኔ','ሐምሌ','ነሐሴ','ጳጉሜን'];
const g2j=(y,m,d)=>{const a=Math.floor((14-m)/12),yy=y+4800-a,mm=m+12*a-3;return d+Math.floor((153*mm+2)/5)+365*yy+Math.floor(yy/4)-Math.floor(yy/100)+Math.floor(yy/400)-32045};
const e2j=(y,m,d)=>1724221+365*(y-1)+Math.floor(y/4)+30*(m-1)+d-1;
const toEth=ts=>{const x=new Date(ts),j=g2j(x.getFullYear(),x.getMonth()+1,x.getDate()),r=(j-1723856)%1461,n=r%365+365*Math.floor(r/1460);return{y:4*Math.floor((j-1723856)/1461)+Math.floor(r/365)-Math.floor(r/1460),m:Math.floor(n/30)+1,d:n%30+1}};
const ethToTs=(y,m,d)=>new Date(T0.getFullYear(),T0.getMonth(),T0.getDate()+e2j(y,m,d)-g2j(T0.getFullYear(),T0.getMonth()+1,T0.getDate())).getTime();
const eName=m=>(S.lang==='am'&&!XL?EMA:EMN)[m-1];
const eFmt=ts=>{const e=toEth(ts);return e.d+' '+eName(e.m)+' '+e.y+(S.lang==='am'&&!XL?' ዓ.ም.':' E.C.')};
const gFmt=ts=>new Date(ts).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});
const dsp=ts=>CAL==='ec'?eFmt(ts):iso(new Date(ts));
const fmtD=s=>CAL==='ec'?eFmt(parseD(s).getTime()):gFmt(parseD(s).getTime());
const fmtBoth=s=>{const x=parseD(s).getTime();return CAL==='ec'?eFmt(x)+' ('+gFmt(x)+')':gFmt(x)+' ('+eFmt(x)+')'};
const dsd=k=>CAL==='ec'&&/^\d{4}-\d\d-\d\d$/.test(k)?fmtD(k):k;

function doReturn(sid){
  if(!canEdit()){toast('Only a pharmacist can return a sale');return}
  const g=S.sales.filter(s=>s.sid===sid);if(!g.length){closeSheet();return}
  const why=S.retWhy,note=val('reto').trim(),stk=$('#retstk')&&$('#retstk').checked;
  if(!why){toast('Choose a reason');return}
  if(why==='Other'&&!note){toast('Write the reason in the note');return}
  const now=Date.now(),P=salePays(g),cr=P.find(p=>p.m==='credit'),tt=g.reduce((a,x)=>a+x.qty*x.price,0);
  if(stk)g.forEach(x=>{const m=med(x.medId);if(!m)return;
    (x.bt||[{no:null,q:x.qty}]).forEach(y=>{let b=y.no&&m.batches.find(z=>z.no===y.no);if(!b)b=[...m.batches].sort(byExp).pop();if(b)b.qty+=y.q})});
  S.returns.push({rid:uid(),sid,ts:g[0].ts,rts:now,by:who(),reason:why,note,restock:!!stk,lines:g.map(x=>({medId:x.medId,qty:x.qty,price:x.price})),pays:P,cash:(P.find(p=>p.m==='cash')||{amt:0}).amt});
  S.sales=S.sales.filter(s=>s.sid!==sid);delete S.pays[sid];
  log('sale','Returned sale '+etb(tt),why+(note?': '+note:'')+(stk?', stock restored':', not restocked'));
  const c=g[0].cust&&cust(g[0].cust);
  if(c&&cr){const o=c.tx.find(x=>x.sid===sid&&x.type==='sale');if(o)o.ret=true;c.tx.push({id:uid(),ts:now,type:'ret',amt:cr.amt,sid,note:'Returned: '+why});log('credit','Credit cancelled '+etb(cr.amt)+' for '+c.name)}
  const rx=S.rx.filter(r=>r.sid===sid);rx.forEach(r=>{r.ret={ts:now,reason:why,note,by:who(),stk:!!stk}});if(rx.length)log('rx','Marked Rx entries as Returned',rx.map(r=>rxId(r.seq)).join(', '));
  closeSheet();toast('Sale returned');render()}

function checkout(){
  S.rfCur=null;if(!S.cart.length){toast('Add a medicine first');return}
  const plan=[];
  for(const l of S.cart){const m=med(l.medId),a=alloc(m,l.qty);if(!a){toast('Not enough sellable stock for '+m.name);return}plan.push({m,qty:l.qty,a})}
  if(!saleExpGate(plan))return;
  const miss=rxMissing(plan,S.rxForms);
  if(miss){rxFlag(miss);return}
  const fl=rfRules(plan,S.rxForms);if(fl.length&&!rfGate(fl))return;
  const total=cartTotal(),st=payState(total);

  const cr=st.pays.find(p=>p.m==='credit');if(cr){cr.cust=S.cartCust;if(!cust(cr.cust)){toast('Choose a customer');return}}
  const dv=discCheck();if(dv.err){toast(t(dv.err));return}
  const rs=[];if(cr)rs.push(...credCheck(cust(cr.cust),cr.amt).rs);rs.push(...dv.rs);
  if(rs.length&&!approved('ck|'+(cr?cr.cust+'|'+cr.amt:'')+'|'+dv.amt,rs,checkout))return;

  const low=plan.map(x=>x.m).find(m=>need(m));
  S.cart=[];S.pay='cash';S.payMode='single';S.split={cash:'',mobile:'',bank:'',credit:''};S.cartQ='';S.dsc={t:'pct',v:'',why:'',n:''};S.ok={};
  toast('Sale completed, '+etb(total));
  if(low&&alertOn('nLow')){const q=sellable(low);notify(q===0?'Out of stock: '+low.name:'Low stock: '+low.name,q===0?'0 units left. Time to reorder.':q+' left (reorder level '+rl(low)+')')}
  render();rcptSheet(sid,true)}

const lastDay=(y,m)=>new Date(y,m,0).getDate();
/* accepts MM/YYYY, MM/YY, YYYY-MM (month only: last day of the month) and DD/MM/YYYY, YYYY-MM-DD */
function parseExp(raw){
  const x=String(raw||'').trim().replace(/\s+/g,'');let g,m,y,d,month=false;
  if(g=x.match(/^(\d{4})[\/.\-](\d{1,2})[\/.\-](\d{1,2})$/)){y=+g[1];m=+g[2];d=+g[3]}
  else if(g=x.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{4})$/)){d=+g[1];m=+g[2];y=+g[3]}
  else if(g=x.match(/^(\d{4})[\/.\-](\d{1,2})$/)){y=+g[1];m=+g[2];month=true}
  else if(g=x.match(/^(\d{1,2})[\/.\-](\d{4})$/)){m=+g[1];y=+g[2];month=true}
  else if(g=x.match(/^(\d{1,2})[\/.\-](\d{2})$/)){m=+g[1];y=2000+(+g[2]);month=true}
  else if(g=x.match(/^(\d{2})(\d{4})$/)){m=+g[1];y=+g[2];month=true}
  else if(g=x.match(/^(\d{8})$/)){const a=+x.slice(0,4),b=+x.slice(4,6);if(a>=1900&&a<=2199&&b<=12){y=a;m=b;d=+x.slice(6)}else{d=+x.slice(0,2);m=+x.slice(2,4);y=+x.slice(4)}}
  else return{err:1};
  if(CAL==='ec'){if(m<1||m>13||y<1900||y>2199)return{err:1};const ld=m<13?30:(y%4===3?6:5);if(month)d=ld;if(d<1||d>ld)return{err:1};const o=iso(new Date(ethToTs(y,m,d)));return{iso:o,month,days:daysTo(o)}}

    ['Expenses',r2(N.ex),r2(NP.ex),pc(N.ex,NP.ex)],['Written-off stock',r2(N.wo),r2(NP.wo),pc(N.wo,NP.wo)],['Estimated net profit',r2(N.net),r2(NP.net),pc(N.net,NP.net)],
    ['Credit given',r2(C.given),r2(P.given),pc(C.given,P.given)],['Credit still owed',r2(C.owed),r2(P.owed),pc(C.owed,P.owed)],['Purchase orders',r2(C.po),r2(P.po),pc(C.po,P.po)]];
  B.filter(b=>b.t<=now&&(S.fp!=='day'||b.v>0)).forEach(b=>rows.push(['Sales by '+finUnit()+': '+b.full,r2(b.v),'','']));
  {const k=bestKey();X.best.forEach(x=>rows.push(['Best seller ('+(k==='q'?'units':k==='r'?'revenue':'profit')+'): '+x.m.name,k==='q'?x.q:r2(x[k]),'','']))}
  Object.keys(CATS).filter(k=>X.cat[k]>0).forEach(k=>rows.push(['Sales by category: '+CATS[k],r2(X.cat[k]),'','']));
  return{title:'Finance, '+R.nm,sub:R.txt+', compared with '+R.ptxt,pre:[['Period',R.txt,R.ptxt,''],['','','','']],cols:['Item','This period','Previous','Change'],rows,show:7,file:'pharmacare-finance-'+S.fp+'-'+R.key+'.csv'}}

const formOptions=sel=>`<option value="">${t('Choose…')}</option>`+Object.keys(FORMS).map(k=>`<option value="${k}"${k===sel?' selected':''}>${esc(formName(k))}</option>`).join('');

/* ---------- STOCKTAKE ---------- */
const diffHtml=d=>d===null?'<span class="muted">—</span>':d===0?bd('Match','green'):bd((d>0?'+':'')+d,d>0?'blue':'red');
/* ST1 snapshot per batch at the moment it is counted · ST2 per-batch counts, new batches need real data · ST3 blind count + second counter */
const HV=100,needs2=m=>m.type==='ctrl'||m.price>=HV;
const ST_PCT=5,ST_ETB=500,CYC={risk:7,rest:30};
const WHY={s:['Expired','Damaged','Lost or unknown','Registration error'],e:['Registration error','Delivery not recorded','Returned stock','Other']};
let _si=0;
function stInit(){if(_si)return;_si=1;S.sessions=S.sessions||[];S.appr=S.appr||[];try{const j=JSON.parse(localStorage.getItem('pc_st')||'null');if(j){if(j.cs)S.cs=j.cs;if(j.sessions)S.sessions=j.sessions;if(j.appr)S.appr=j.appr}}catch(e){}}
function stSave(){if(!_si)return;if(S.cs)S.cs.ts=Date.now();try{localStorage.setItem('pc_st',JSON.stringify({cs:S.cs,sessions:S.sessions,appr:S.appr}))}catch(e){}}
const CS=()=>{stInit();const c=S.cs||(S.cs={n1:'',n2:'',n3:'',phase:'count',C:{}});if(!c.f)c.f={q:'',cat:'all',zone:'all',mode:'all'};if(!c.lim)c.lim=40;return c};
const stDue=m=>{const a=m.lastCount?(Date.now()-m.lastCount)/DAY:1e9;return a>(needs2(m)?CYC.risk:CYC.rest)};
const lastTxt=m=>m.lastCount?'Counted '+Math.max(0,Math.floor((Date.now()-m.lastCount)/DAY))+' days ago':'Never counted';
function vOf(m,c){const o={sys:0,net:0,sU:0,sV:0,eU:0,eV:0,ctrl:m.type==='ctrl'};m.batches.forEach(b=>{const r=c.r[b.no],d=parseInt(r.v)-r.snap;o.sys+=r.snap;o.net+=d;if(d<0){o.sU-=d;o.sV-=d*bcost(m,b)}else if(d>0){o.eU+=d;o.eV+=d*bcost(m,b)}});c.x.forEach(x=>{o.net+=x.q;o.eU+=x.q;o.eV+=x.q*m.cost});return o}
const vOver=o=>o.net!==0&&(o.ctrl||(o.sys?Math.abs(o.net)/o.sys*100>ST_PCT:true)||Math.max(o.sV,o.eV)>ST_ETB);
const cRec=id=>CS().C[id]||(CS().C[id]={r:{},x:[],c2:'',c3:'',none:false});
function cDone(m){const c=CS().C[m.id];if(!c)return false;return m.batches.every(b=>c.r[b.no]&&c.r[b.no].v!=='')&&(m.batches.length>0||c.none||c.x.length>0)}
function cRes(m){if(!needs2(m))return'ok';const c=CS().C[m.id],t1=m.batches.reduce((a,b)=>a+(parseInt(c.r[b.no].v)||0),0)+c.x.reduce((a,x)=>a+x.q,0);
  if(c.c2==='')return'need2';if(+c.c2===t1)return'ok';if(c.c3==='')return'need3';return+c.c3===t1?'ok':'bad'}
function stStat(m){const c=CS().C[m.id]||{r:{}},k=m.batches.filter(b=>c.r[b.no]&&c.r[b.no].v!=='').length;return cDone(m)?bd('Counted','green'):k?bd(k+' / '+m.batches.length,'amber'):''}
function stSummaryHtml(){const L=S.meds.filter(m=>!m.arch),n=L.filter(cDone).length,p=L.filter(m=>CS().C[m.id]&&!cDone(m)).length;
  return `<div class="rowb"><div><b>${n} / ${L.length} counted</b><div class="muted">${p?p+' started, not finished':'Differences show after Review'}</div></div><button class="btn sm" data-a="stReview" ${n?'':'disabled'}>Review</button></div>`}
function stCard(m){const c=CS().C[m.id]||{r:{},x:[]},bs=[...m.batches].sort(byExp);
  return `<div class="stc" id="c_${m.id}"><div class="rowb"><div class="grow"><b style="font-size:14px">${esc(m.name)}</b><div class="muted">${m.zone?esc(m.zone)+' · ':''}${lastTxt(m)}${stDue(m)?' · due':''}</div>${needs2(m)?`<div style="margin-top:4px">${bd('Second count required','purple')}</div>`:''}</div><span id="cs_${m.id}">${stStat(m)}</span></div>

  ${c.x.map((x,i)=>`<div class="sbr"><div class="grow"><b class="mono">${esc(x.no)}</b> ${bd('New','blue')}<div class="muted">Exp ${fmtD(x.exp)} · found ${x.q}</div></div><button class="ibtn" data-a="stDelX" data-id="${m.id}" data-i="${i}" aria-label="Remove ${esc(x.no)}">${ic('trash',18)}</button></div>`).join('')}
  ${!m.batches.length&&!c.none&&!c.x.length?`<div class="sbr"><div class="grow muted">No batch is listed for this medicine.</div><button class="btn ghost sm" data-a="stNone" data-id="${m.id}">Nothing on shelf</button></div>`:''}${c.none?'<div class="sbr muted">Nothing on the shelf</div>':''}
  <button class="lk" data-a="stNew" data-id="${m.id}">Found a batch that is not listed</button></div>`}
function stPaint(id){const e=$('#c_'+id);if(e)e.outerHTML=stCard(med(id));const q=$('#sts');if(q)q.innerHTML=stSummaryHtml()}
function stRevCard(m){const cs=CS(),c=cs.C[m.id],rs=cRes(m),own=S.role==='owner',o=rs==='ok'?vOf(m,c):null,ov=o&&vOver(o);
  let h=`<div class="stc"><div class="rowb"><b style="font-size:14px">${esc(m.name)}</b><span>${needs2(m)?bd('Second count','purple')+' ':''}${ov?bd(own?'Above limit':'Owner approval','amber'):''}</span></div>`;
  if(rs==='need2'||rs==='need3')return h+`<div class="sbr"><div class="grow"><b>${rs==='need2'?'Second count':'Third count'}</b><div class="muted">${rs==='need2'?'A different person counts the total units. Do not share the first count.':'The counts differ. A third person counts the total units.'}</div></div><input id="c2_${m.id}" class="inp" type="number" inputmode="numeric" min="0" placeholder="Total"><button class="btn sm" data-a="st2" data-id="${m.id}" data-r="${rs==='need2'?2:3}">Save</button></div></div>`;
  if(rs==='bad')return h+`<div class="note warn">${ic('alert',16)}<span>The counts do not agree. Count this medicine again.</span></div><button class="btn ghost sm" data-a="stRecount" data-id="${m.id}">Recount</button></div>`;
  m.batches.forEach(b=>{const r=c.r[b.no],v=parseInt(r.v),mv=b.qty-r.snap;h+=`<div class="sbr"><div class="grow"><b class="mono">${esc(b.no)}</b><div class="muted">Counted ${v} · expected ${r.snap}</div>${mv?`<div class="muted">${Math.abs(mv)} ${mv<0?'sold or removed':'received'} after you counted. Not a loss.</div>`:''}</div>${diffHtml(v-r.snap)}</div>`});
  c.x.forEach(x=>{h+=`<div class="sbr"><div class="grow"><b class="mono">${esc(x.no)}</b> ${bd('New batch','blue')}<div class="muted">Exp ${fmtD(x.exp)} · found ${x.q}</div></div>${diffHtml(x.q)}</div>`});
  if(o.net!==0)h+=`<div class="sbr"><div class="grow"><b>Reason${ov&&!c.why?' <span class="t-red">required</span>':''}</b><div class="muted">${etb(Math.round(o.net<0?o.sV:o.eV))} ${o.net<0?'short':'extra'}${ov?(o.ctrl?'. Controlled drug: a reason and the owner approval are always needed':'. Above '+ST_PCT+'% or '+etb(ST_ETB)):''}</div></div><select class="inp rsn" data-id="${m.id}" style="width:158px"><option value="">${ov?'Choose a reason':'No reason'}</option>${(o.net<0?WHY.s:WHY.e).map(w=>`<option${c.why===w?' selected':''}>${w}</option>`).join('')}</select></div>`;
  return h+(needs2(m)?`<div class="muted" style="padding-top:8px">Second count matched${c.c3!==''?' (third count)':''}.</div>`:'')+'</div>'}
function stReview(){const cs=CS(),own=S.role==='owner',L=S.meds.filter(m=>!m.arch&&cs.C[m.id]),D=L.filter(cDone),P=L.filter(m=>!cDone(m));let sV=0,eV=0,sU=0,eU=0,ready=0,wait=0,nw=0,ov=0;
  D.forEach(m=>{if(cRes(m)!=='ok'){wait++;return}ready++;const c=cs.C[m.id],o=vOf(m,c);sV+=o.sV;eV+=o.eV;sU+=o.sU;eU+=o.eU;if(vOver(o)){ov++;if(!c.why)nw++}});

  return `<div class="card sticky"><div class="rowb"><div><b>Review · counted by ${esc(cs.n1)}</b><div class="muted">Missing ${sU} units (${etb(Math.round(sV))}) · Extra ${eU} (${etb(Math.round(eV))})</div><div class="muted">${ready} ready${wait?' · '+wait+' waiting for a recount':''}${P.length?' · '+P.length+' not finished, skipped':''}</div></div><button class="btn sm" data-a="applyCount" ${ready&&!nw?'':'disabled'}>${ov&&!own?'Send to owner':'Apply'}</button></div>
  ${ov?`<div class="muted" style="margin-top:8px">${ov} above the limit (${ST_PCT}% or ${etb(ST_ETB)}). ${nw?'Choose a reason for '+nw+'. ':''}${own?'You can approve these yourself.':'The owner must approve before stock changes.'}</div>`:''}</div>
  <button class="btn ghost" style="margin-top:0;margin-bottom:10px" data-a="stBack">Back to counting</button>${nm('need2','Second counter name')}${nm('need3','Third counter name')}
  ${D.map(stRevCard).join('')}${P.map(m=>{const c=cs.C[m.id],k=m.batches.filter(b=>c.r[b.no]&&c.r[b.no].v!=='').length;return `<div class="stc"><div class="rowb"><b style="font-size:14px">${esc(m.name)}</b>${bd('Not finished','amber')}</div><div class="muted">${k} of ${m.batches.length} batches counted. Go back to finish it, or it is skipped.</div></div>`}).join('')}`}
function stFiltered(){const f=CS().f,B=S.meds.filter(m=>!m.arch),L=f.q?searchMeds(B,f.q).map(r=>r.m):B;return L.filter(m=>(f.cat==='all'||m.cat===f.cat)&&(f.zone==='all'||m.zone===f.zone)&&(f.mode==='all'||(f.mode==='todo'?!cDone(m):stDue(m))))}

function stCommit(E,meta){stInit();const now=Date.now(),sid=nextNo('ST',4,S.sessions.map(x=>x.id)),items=[];let sU=0,sV=0,eU=0,eV=0;

    const prev=m.lastCount||now-30*DAY,rx=m.type==='ctrl'?{s:S.sales.filter(x=>x.medId===m.id&&x.ts>prev).reduce((a,x)=>a+x.qty,0),r:S.rx.filter(x=>x.medId===m.id&&x.ts>prev&&rxLive(x)).reduce((a,x)=>a+x.qty,0)}:null;let net=0;const parts=[];

    c.x.forEach(x=>{m.batches.push({no:x.no,exp:x.exp,qty:x.q,cost:m.cost,inv:'',rcv:iso(T0),found:true});net+=x.q;parts.push(x.no+' new +'+x.q);log('count','Stocktake '+sid+': '+m.name+', new batch '+x.no+' found +'+x.q,'Exp '+fmtD(x.exp)+' · '+by)});
    if(net||m.type==='ctrl')led(m,'count',net,sid,net?parts.join(', ')+' · '+w:'Counted by hand, matches the register',{appr:m.type==='ctrl'?(meta.appr||who()):''});if(m.type==='ctrl'&&net)notify('Controlled drug difference',m.name+': '+(net>0?'+':'')+net+' units ('+w+'). Alert sent to the owner (simulated).');m.lastCount=now;sU+=o.sU;sV+=o.sV;eU+=o.eU;eV+=o.eV;
