name: pharmacare
description: PharmaCare - pharmacy stock, sales, credit and audit app (Flutter port of the HTML preview).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.11.1

  # State + routing
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  # pdf 3.13 requires xml 7, which conflicts with excel 4.0.6 (xml < 7).
  pdf: '>=3.12.0 <3.13.0'
  printing: ^5.14.3
  excel: ^4.0.6
  share_plus: ^12.0.2
  cross_file: ^0.3.5+5

  # Security
  crypto: ^3.0.3                 # SHA-256 for the audit hash chain
  cryptography: ^2.7.0           # PBKDF2 for the app-lock PIN
  flutter_secure_storage: ^9.2.2 # Keychain / Android Keystore
  local_auth: ^2.3.0             # Fingerprint / face unlock

  # Non-sensitive preferences (language, theme, calendar)
  shared_preferences: ^2.2.3

  # Local-first auth/account records. Hive remains usable before Firebase is
  # configured; Firebase can be enabled later for cross-device sync.
  hive_flutter: ^1.1.0
  hive: ^2.2.3

  # Backend packages are ready for project configuration; no credentials are
  # committed to the app.
  firebase_core: ^3.4.0
  firebase_auth: ^5.2.0
  cloud_firestore: ^5.4.0
  cloud_functions: ^5.1.0
  mobile_scanner: ^5.2.3

  # ---- OPTIONAL -----------------------------------------------------------
  # firebase_app_check: ^0.3.1
  # firebase_crashlytics: ^4.1.0
  # cryptography_flutter: ^2.3.2
  # drift: ^2.20.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/i18n/
  # fonts:   # download the .ttf files into assets/fonts, then uncomment
  #   - family: NotoSansEthiopic
  #     fonts:
  #       - asset: assets/fonts/NotoSansEthiopic-Regular.ttf
  #       - asset: assets/fonts/NotoSansEthiopic-SemiBold.ttf
  #         weight: 600
